<!-- 蟠螭纹 | 春秋 | typical on: 鼎 簋 盘 壶 豆 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Panchi: small coiling hornless dragons interlaced in dense pattern — Spring-Autumn period -->
  <!-- Multiple intertwined serpentine bodies filling the field -->

  <!-- Dragon 1: upper-left coil, head facing right -->
  <path d="M10 12 C14 8 20 8 22 12 C24 16 20 20 16 20 C12 20 8 18 8 22 C8 26 12 28 16 26 C20 24 22 20 24 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <!-- D1 head -->
  <circle cx="24" cy="16" r="4" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="25.5" cy="14.5" r="1.2" fill="currentColor"/>
  <!-- D1 horn (panchi = hornless, use short ear-like nub) -->
  <path d="M22 12 C20 8 22 6 24 8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Dragon 2: upper-right coil, interlocking with D1 -->
  <path d="M40 10 C44 6 52 6 54 12 C56 18 52 22 48 22 C44 22 40 20 40 24 C40 28 44 30 48 28 C52 26 56 22 58 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="40" cy="14" r="4" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="38.5" cy="12.5" r="1.2" fill="currentColor"/>
  <path d="M42 10 C42 6 44 4 46 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Dragon 3: crossing through center, facing down-right -->
  <path d="M28 18 C32 14 38 16 40 22 C42 28 38 34 32 34 C26 34 22 30 22 26 C22 22 26 20 28 22 C30 24 28 28 26 30" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="42" cy="24" r="3.5" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="43.5" cy="22.5" r="1.1" fill="currentColor"/>

  <!-- Dragon 4: lower-left coil -->
  <path d="M8 38 C12 32 20 32 22 38 C24 44 20 48 14 48 C8 48 6 44 8 40 C10 36 14 38 16 40 C18 42 18 46 16 48" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="22" cy="42" r="4" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="23.5" cy="40.5" r="1.2" fill="currentColor"/>

  <!-- Dragon 5: lower-center interlocking -->
  <path d="M34 36 C38 30 46 32 48 38 C50 44 46 50 40 50 C34 50 30 46 32 42 C34 38 38 38 40 40 C42 42 42 46 40 48" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="50" cy="40" r="3.5" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="51.5" cy="38.5" r="1.1" fill="currentColor"/>

  <!-- Dragon 6: right side coil -->
  <path d="M56 24 C62 20 70 22 72 28 C74 34 70 40 64 40 C58 40 54 36 56 32 C58 28 62 28 64 30 C66 32 64 36 62 38" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="72" cy="32" r="3.5" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="73.5" cy="30.5" r="1.1" fill="currentColor"/>

  <!-- Dragon 7: bottom-left -->
  <path d="M10 56 C14 50 22 52 24 58 C26 64 22 70 16 70 C10 70 8 64 10 60 C12 56 16 56 18 58 C20 60 18 64 16 66" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="24" cy="62" r="3.5" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="25.5" cy="60.5" r="1.1" fill="currentColor"/>

  <!-- Dragon 8: bottom-right, tail suggestion -->
  <path d="M40 56 C44 50 52 52 54 58 C56 64 52 70 46 70 C40 70 38 64 40 60 C42 56 46 56 48 58 C50 60 48 64 46 66" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="54" cy="62" r="3.5" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="55.5" cy="60.5" r="1.1" fill="currentColor"/>

  <!-- Tail tip for some dragons to show interweaving -->
  <path d="M26 30 C24 34 22 38 24 40" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M16 48 C18 52 18 56 16 58" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M46 48 C48 52 50 54 50 58" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
</svg>
