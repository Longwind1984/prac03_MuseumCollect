<!-- 羽翅纹 | 战国晚期 | typical on: 壶 盘 鉴 鸟形器 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Yuchi: spread wing/feather pattern — fan-like radiating feather forms -->
  <!-- Wings fanned out symmetrically from central axis -->

  <!-- Central spine -->
  <line x1="40" y1="6" x2="40" y2="74" stroke="currentColor" stroke-width="2"/>

  <!-- Left wing: layered feathers spreading left-downward -->
  <!-- Feather 1 (innermost, short) -->
  <path d="M38 14 C30 18 22 20 16 20 C12 20 10 18 10 16 C10 14 12 12 16 14 C20 16 28 16 38 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Feather 2 -->
  <path d="M38 22 C28 28 16 32 8 32 C4 32 2 30 4 28 C6 26 10 26 16 28 C24 30 32 28 38 22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Feather 3 -->
  <path d="M38 32 C26 40 12 44 4 44 C0 44 0 42 2 40 C4 38 10 38 18 40 C28 42 34 38 38 32" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Feather 4 -->
  <path d="M38 42 C24 52 10 58 2 60 C0 62 2 64 6 62 C12 60 22 56 36 48 L38 42" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Feather 5 (longest outer) -->
  <path d="M38 52 C22 62 8 70 2 74 C6 76 12 72 20 66 C30 60 36 56 40 52" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Right wing (mirror) -->
  <!-- Feather 1 (innermost) -->
  <path d="M42 14 C50 18 58 20 64 20 C68 20 70 18 70 16 C70 14 68 12 64 14 C60 16 52 16 42 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Feather 2 -->
  <path d="M42 22 C52 28 64 32 72 32 C76 32 78 30 76 28 C74 26 70 26 64 28 C56 30 48 28 42 22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Feather 3 -->
  <path d="M42 32 C54 40 68 44 76 44 C80 44 80 42 78 40 C76 38 70 38 62 40 C52 42 46 38 42 32" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Feather 4 -->
  <path d="M42 42 C56 52 70 58 78 60 C80 62 78 64 74 62 C68 60 58 56 44 48 L42 42" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Feather 5 (longest outer) -->
  <path d="M42 52 C58 62 72 70 78 74 C74 76 68 72 60 66 C50 60 44 56 40 52" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Feather barb lines (short cross-lines on each feather) -->
  <line x1="20" y1="20" x2="22" y2="24" stroke="currentColor" stroke-width="0.8"/>
  <line x1="14" y1="32" x2="16" y2="36" stroke="currentColor" stroke-width="0.8"/>
  <line x1="10" y1="44" x2="12" y2="48" stroke="currentColor" stroke-width="0.8"/>
  <line x1="60" y1="20" x2="58" y2="24" stroke="currentColor" stroke-width="0.8"/>
  <line x1="66" y1="32" x2="64" y2="36" stroke="currentColor" stroke-width="0.8"/>
  <line x1="70" y1="44" x2="68" y2="48" stroke="currentColor" stroke-width="0.8"/>
</svg>
