<!-- 凤鸟纹 | 西周中期 | typical on: 簋 尊 卣 壶 觥 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Fengniu (Western Zhou phoenix): elegant long crest, sweeping tail, graceful posture — very different from Shang niao -->
  <!-- Long flowing crest (signature: sweeps back and up dramatically) -->
  <path d="M50 18 C56 10 66 6 72 8 C76 10 76 16 70 18 C64 20 58 16 54 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Crest curl at tip -->
  <path d="M70 18 C74 20 76 24 72 24 C68 24 66 20 68 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Head (round, elegant) -->
  <circle cx="50" cy="22" r="7" stroke="currentColor" stroke-width="1.8"/>
  <!-- Eye -->
  <circle cx="52" cy="20" r="2.5" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="52" cy="20" r="1" fill="currentColor"/>
  <!-- Curved beak (gentler than Shang) -->
  <path d="M54 24 C58 22 60 26 58 28 C56 30 52 28 52 26" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Neck (elegant S-curve) -->
  <path d="M46 26 C40 30 38 38 40 44" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Body (full, rounded — Zhou phoenix is plump) -->
  <path d="M40 44 C38 52 40 62 46 66 C52 70 62 68 66 62 C70 56 68 48 62 44 C58 40 50 40 40 44 Z" stroke="currentColor" stroke-width="2"/>
  <!-- Wing suggestion (overlapping feathers) -->
  <path d="M44 46 C42 42 44 36 48 34 C52 32 56 34 56 38" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M56 38 C60 36 66 38 66 44" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Wing feathers -->
  <path d="M46 40 L44 34 M50 38 L50 32 M54 38 L56 32" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Long sweeping tail (the most distinctive Zhou feature) -->
  <path d="M46 66 C42 70 34 74 24 76 C16 78 10 74 10 70 C10 66 16 64 22 66 C28 68 32 72 36 72" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Tail feathers (multiple sweeping lines) -->
  <path d="M40 68 C32 66 18 62 12 60" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M42 70 C34 72 20 74 12 72" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Legs -->
  <path d="M52 68 C52 72 50 76 48 78 M56 68 C58 72 58 76 60 78" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Talons -->
  <path d="M46 78 L44 80 M48 78 L48 80 M50 78 L52 80" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
</svg>
