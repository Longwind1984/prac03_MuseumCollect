<!-- 蝉纹 | 商西周 | typical on: 觚 尊 圈足 器腹边缘 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Chan: stylized cicada — triangular body, eye pair, two pairs of wings, simplified -->
  <!-- Bronze-age cicada is always frontal, triangular, highly abstracted -->

  <!-- 3x2 grid of cicada units (they appear as repeating band) -->

  <!-- Cicada unit macro definition as repeated shapes -->
  <!-- Row 1, Unit 1 (left) -->
  <!-- Triangle body -->
  <path d="M12 8 L4 28 L20 28 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Eyes (pair of dots) -->
  <circle cx="9" cy="14" r="1.5" fill="currentColor"/>
  <circle cx="15" cy="14" r="1.5" fill="currentColor"/>
  <!-- Wing pair 1 (upper) -->
  <path d="M4 28 C2 22 2 16 6 14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M20 28 C22 22 22 16 18 14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
