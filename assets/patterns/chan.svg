  <circle cx="65" cy="50" r="1.5" fill="currentColor"/>
  <circle cx="71" cy="50" r="1.5" fill="currentColor"/>
  <path d="M60 64 C58 58 58 52 62 50" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M76 64 C78 58 78 52 74 50" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M60 64 C56 68 56 74 60 76" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M76 64 C80 68 80 74 76 76" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="64" y1="56" x2="72" y2="56" stroke="currentColor" stroke-width="0.8"/>
