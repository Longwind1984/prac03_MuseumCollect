  <path d="M4 28 C0 32 0 38 4 40" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M20 28 C24 32 24 38 20 40" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Abdomen line (segment suggestion) -->
