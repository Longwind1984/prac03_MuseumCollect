  <line x1="35" y1="24" x2="45" y2="24" stroke="currentColor" stroke-width="0.8"/>

  <!-- Row 1, Unit 3 (right) -->
  <path d="M68 8 L60 28 L76 28 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
