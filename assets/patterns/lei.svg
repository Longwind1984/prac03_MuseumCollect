  <!-- Large 4-unit meander grid — pure angular turns, denser than yunlei -->
  <!-- Row 1 -->
  <path d="M6 6 L6 26 L26 26 L26 6 L10 6 L10 22 L22 22 L22 10 L14 10 L14 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter"/>
