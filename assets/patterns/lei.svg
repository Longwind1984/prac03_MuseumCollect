  <path d="M54 54 L54 74 L74 74 L74 54 L58 54 L58 70 L70 70 L70 58 L62 58 L62 66" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
