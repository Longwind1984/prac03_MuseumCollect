<!-- 波曲纹 | 西周晚期 | typical on: 壶 鼎 盘 簋 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Boqu (wave-scroll / ring-band): undulating wave with C-scroll terminations -->
  <!-- Characteristic: wave crests terminate in tight spirals, animal head vestige -->

  <!-- Wave band 1 (top) -->
  <path d="M4 16 C10 8 18 8 22 16 C26 24 34 24 40 16 C46 8 54 8 60 16 C66 24 72 24 76 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Wave crest spirals (top) -->
  <path d="M22 16 C22 12 20 10 18 12 C16 14 18 18 22 16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M40 16 C40 12 38 10 36 12 C34 14 36 18 40 16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M60 16 C60 12 58 10 56 12 C54 14 56 18 60 16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Wave trough dots (eye vestige — animal head remnant) -->
  <circle cx="11" cy="16" r="1.5" fill="currentColor"/>
  <circle cx="31" cy="16" r="1.5" fill="currentColor"/>
  <circle cx="51" cy="16" r="1.5" fill="currentColor"/>

  <!-- Wave band 2 (middle) -->
  <path d="M4 38 C10 30 18 30 22 38 C26 46 34 46 40 38 C46 30 54 30 60 38 C66 46 72 46 76 40" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <path d="M22 38 C22 34 20 32 18 34 C16 36 18 40 22 38" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M40 38 C40 34 38 32 36 34 C34 36 36 40 40 38" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M60 38 C60 34 58 32 56 34 C54 36 56 40 60 38" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="11" cy="38" r="1.5" fill="currentColor"/>
  <circle cx="31" cy="38" r="1.5" fill="currentColor"/>
  <circle cx="51" cy="38" r="1.5" fill="currentColor"/>

  <!-- Wave band 3 (bottom) -->
  <path d="M4 60 C10 52 18 52 22 60 C26 68 34 68 40 60 C46 52 54 52 60 60 C66 68 72 68 76 62" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <path d="M22 60 C22 56 20 54 18 56 C16 58 18 62 22 60" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M40 60 C40 56 38 54 36 56 C34 58 36 62 40 60" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M60 60 C60 56 58 54 56 56 C54 58 56 62 60 60" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="11" cy="60" r="1.5" fill="currentColor"/>
  <circle cx="31" cy="60" r="1.5" fill="currentColor"/>
  <circle cx="51" cy="60" r="1.5" fill="currentColor"/>

  <!-- Band separator lines -->
  <line x1="4" y1="24" x2="76" y2="24" stroke="currentColor" stroke-width="0.8"/>
  <line x1="4" y1="46" x2="76" y2="46" stroke="currentColor" stroke-width="0.8"/>
  <line x1="4" y1="68" x2="76" y2="68" stroke="currentColor" stroke-width="0.8"/>
</svg>
