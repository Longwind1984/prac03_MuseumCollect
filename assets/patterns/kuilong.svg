<!-- 夔龙纹 | 商中晚期 | typical on: 鼎 簋 尊 卣 觥 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Kuilong: side-view one-legged dragon. Signature: single back leg, open jaw, curled tail, C-horn -->
  <!-- Head (open jaw, facing left) -->
  <path d="M62 20 C68 18 72 22 72 28 C72 32 70 36 66 37" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Upper jaw -->
  <path d="M62 20 C58 16 52 18 50 22 C48 26 50 30 54 32 L66 37" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Lower jaw (open) -->
  <path d="M62 20 C60 24 58 28 56 32 L66 37" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Eye -->
  <circle cx="66" cy="26" r="3" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="66" cy="26" r="1.2" fill="currentColor"/>
  <!-- C-horn -->
  <path d="M68 19 C74 14 76 8 72 6 C68 4 66 8 68 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Crest/ear -->
  <path d="M60 18 C58 12 54 10 54 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Body: sinuous S-curve from head toward lower left -->
  <path d="M54 32 C48 36 38 36 32 40 C26 44 22 50 24 56 C26 62 34 64 40 60 C46 56 46 50 42 46" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Single back leg (hallmark feature) -->
  <path d="M30 52 C26 56 24 62 26 66 C28 70 32 70 34 66" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Toes on single leg -->
  <path d="M26 66 L22 70 M28 68 L26 72 M32 68 L32 72" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Tail curling back upward -->
  <path d="M42 46 C38 42 36 36 38 30 C40 24 46 22 50 26 C52 28 50 32 46 32" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Tail tip curl -->
  <path d="M46 32 C42 34 40 32 42 28" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Spine fins -->
  <path d="M52 34 L54 28 M44 38 L42 32 M36 42 L34 36" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
</svg>
