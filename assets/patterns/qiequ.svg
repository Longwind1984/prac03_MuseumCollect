<!-- 窃曲纹 | 西周中晚期 | typical on: 鼎 簋 盨 壶 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Qiequ: abstract S-form derived from simplified taotie/kuilong — eye in center, flanking curls -->
  <!-- This is the key transitional pattern from beast to pure geometry -->
  <!-- 3 horizontal bands of qiequ units -->

  <!-- Band 1 (top): two qiequ units side by side -->
  <!-- Left unit: S-curl with central eye vestige -->
  <path d="M8 18 C8 12 14 8 20 10 C24 12 24 18 20 20 C16 22 10 20 10 24 C10 28 14 32 20 30 C26 28 28 22 28 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Left eye vestige -->
  <ellipse cx="18" cy="20" rx="2.5" ry="2" stroke="currentColor" stroke-width="1.2"/>
  <!-- Left unit mid divider line -->
  <line x1="8" y1="20" x2="28" y2="20" stroke="currentColor" stroke-width="0.8" stroke-dasharray="1 2"/>

  <!-- Right unit (inverted S) -->
  <path d="M34 18 C38 12 44 10 48 14 C52 18 50 24 46 24 C42 24 38 20 38 24 C38 28 42 32 48 30 C54 28 56 22 52 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Right eye vestige -->
  <ellipse cx="46" cy="20" rx="2.5" ry="2" stroke="currentColor" stroke-width="1.2"/>

  <!-- Far right unit -->
  <path d="M58 18 C58 12 64 8 70 10 C74 12 74 18 70 20 C66 22 60 20 60 24 C60 28 64 32 70 30 C74 28 76 24 76 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="68" cy="20" rx="2.5" ry="2" stroke="currentColor" stroke-width="1.2"/>

  <!-- Band separator line -->
  <line x1="4" y1="36" x2="76" y2="36" stroke="currentColor" stroke-width="1.2"/>

  <!-- Band 2 (middle): alternating orientation -->
  <path d="M8 54 C8 48 14 44 20 46 C24 48 24 54 20 56 C16 58 10 56 10 60 C10 64 14 68 20 66 C26 64 28 58 28 54" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="18" cy="56" rx="2.5" ry="2" stroke="currentColor" stroke-width="1.2"/>

  <path d="M34 54 C38 48 44 46 48 50 C52 54 50 60 46 60 C42 60 38 56 38 60 C38 64 42 68 48 66 C54 64 56 58 52 54" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="46" cy="56" rx="2.5" ry="2" stroke="currentColor" stroke-width="1.2"/>

  <path d="M58 54 C58 48 64 44 70 46 C74 48 74 54 70 56 C66 58 60 56 60 60 C60 64 64 68 70 66 C74 64 76 60 76 54" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="68" cy="56" rx="2.5" ry="2" stroke="currentColor" stroke-width="1.2"/>

  <!-- Band separator line -->
  <line x1="4" y1="70" x2="76" y2="70" stroke="currentColor" stroke-width="1.2"/>
</svg>
