<!-- 云雷纹 | 商西周 | typical on: 鼎 簋 尊 (底纹) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Yunlei: dense square spiral meander pattern — ground texture of Shang bronzes -->
  <!-- Top-left spiral unit -->
  <path d="M8 8 L8 22 L22 22 L22 8 L12 8 L12 18 L18 18 L18 12 L14 12 L14 16" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Top-right spiral unit -->
  <path d="M28 8 L28 22 L42 22 L42 8 L32 8 L32 18 L38 18 L38 12 L34 12 L34 16" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Top-far-right spiral unit -->
  <path d="M48 8 L48 22 L62 22 L62 8 L52 8 L52 18 L58 18 L58 12 L54 12 L54 16" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Mid-left spiral unit -->
  <path d="M8 28 L8 42 L22 42 L22 28 L12 28 L12 38 L18 38 L18 32 L14 32 L14 36" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Mid-center spiral unit -->
  <path d="M28 28 L28 42 L42 42 L42 28 L32 28 L32 38 L38 38 L38 32 L34 32 L34 36" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Mid-right spiral unit -->
  <path d="M48 28 L48 42 L62 42 L62 28 L52 28 L52 38 L58 38 L58 32 L54 32 L54 36" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Bottom-left spiral unit -->
  <path d="M8 48 L8 62 L22 62 L22 48 L12 48 L12 58 L18 58 L18 52 L14 52 L14 56" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Bottom-center spiral unit -->
  <path d="M28 48 L28 62 L42 62 L42 48 L32 48 L32 58 L38 58 L38 52 L34 52 L34 56" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Bottom-right spiral unit -->
  <path d="M48 48 L48 62 L62 62 L62 48 L52 48 L52 58 L58 58 L58 52 L54 52 L54 56" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- Partial units on right edge to suggest continuation -->
  <path d="M68 8 L68 22 L74 22 L74 8 L70 8 L70 18" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter" opacity="0.5"/>
  <path d="M68 28 L68 42 L74 42 L74 28 L70 28 L70 38" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter" opacity="0.5"/>
  <path d="M68 48 L68 62 L74 62 L74 48 L70 48 L70 58" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" stroke-linejoin="miter" opacity="0.5"/>
</svg>
