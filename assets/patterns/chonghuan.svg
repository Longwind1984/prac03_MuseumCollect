  <path d="M40 12 C34 14 33 20 36 24 C39 27 45 26 47 22 C49 18 47 13 40 12 Z" stroke="currentColor" stroke-width="1.2"/>
  <!-- Unit 3 -->
  <path d="M63 8 C54 10 52 18 56 24 C60 30 68 30 72 24 C76 18 74 10 63 8 Z" stroke="currentColor" stroke-width="1.8"/>
  <path d="M63 12 C57 14 56 20 59 24 C62 27 68 26 70 22 C72 18 70 13 63 12 Z" stroke="currentColor" stroke-width="1.2"/>

