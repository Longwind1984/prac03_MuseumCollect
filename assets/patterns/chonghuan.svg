  <path d="M17 8 C8 10 6 18 10 24 C14 30 22 30 26 24 C30 18 28 10 17 8 Z" stroke="currentColor" stroke-width="1.8"/>
  <path d="M17 12 C11 14 10 20 13 24 C16 27 22 26 24 22 C26 18 24 13 17 12 Z" stroke="currentColor" stroke-width="1.2"/>
  <!-- Unit 2 -->
