  <path d="M40 40 C31 42 29 50 33 56 C37 62 45 62 49 56 C53 50 51 42 40 40 Z" stroke="currentColor" stroke-width="1.8"/>
  <path d="M40 44 C34 46 33 52 36 56 C39 59 45 58 47 54 C49 50 47 45 40 44 Z" stroke="currentColor" stroke-width="1.2"/>

  <path d="M63 40 C54 42 52 50 56 56 C60 62 68 62 72 56 C76 50 74 42 63 40 Z" stroke="currentColor" stroke-width="1.8"/>
  <path d="M63 44 C57 46 56 52 59 56 C62 59 68 58 70 54 C72 50 70 45 63 44 Z" stroke="currentColor" stroke-width="1.2"/>

  <!-- Bottom separator -->
  <line x1="4" y1="68" x2="76" y2="68" stroke="currentColor" stroke-width="1.2"/>
