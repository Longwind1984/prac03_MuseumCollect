<!-- 宴乐纹 | 战国-汉 | typical on: 壶 鉴 盘 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Yanle: banquet and music scene — seated guests, musicians, dancers, vessels -->
  <!-- Key elements: figures around low table, musician with instrument, dancer with arms raised -->

  <!-- Low banquet table (central) -->
  <rect x="20" y="46" width="40" height="4" rx="1" stroke="currentColor" stroke-width="1.5"/>
  <!-- Table legs -->
  <line x1="24" y1="50" x2="24" y2="56" stroke="currentColor" stroke-width="1.5"/>
  <line x1="56" y1="50" x2="56" y2="56" stroke="currentColor" stroke-width="1.5"/>
  <!-- Vessels on table -->
  <!-- Ding / cup vessel 1 -->
  <path d="M28 46 C27 42 29 40 31 40 C33 40 35 42 34 46" stroke="currentColor" stroke-width="1.2"/>
  <line x1="29" y1="40" x2="29" y2="46" stroke="currentColor" stroke-width="0.8"/>
  <!-- Cup 2 -->
  <path d="M38 46 C37 42 39 40 41 40 C43 40 45 42 44 46" stroke="currentColor" stroke-width="1.2"/>
  <!-- Cup 3 (taller) -->
  <path d="M48 46 C47 40 49 38 51 38 C53 38 55 40 54 46" stroke="currentColor" stroke-width="1.2"/>
  <line x1="51" y1="38" x2="51" y2="36" stroke="currentColor" stroke-width="0.8"/>

  <!-- Seated figure left (guest, drinking) -->
  <!-- Body (seated, cross-legged) -->
  <path d="M6 50 C6 46 8 42 10 40 C12 38 14 38 16 40" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="10" cy="36" r="4" stroke="currentColor" stroke-width="1.5"/>
  <!-- Topknot -->
  <path d="M10 32 L10 28" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Arm raising cup -->
  <path d="M14 40 C18 38 20 36 18 34" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Cup in hand -->
  <path d="M18 34 C19 32 21 32 22 34" stroke="currentColor" stroke-width="1.2"/>
  <!-- Robe folds -->
  <path d="M6 50 C8 52 10 56 8 60 M16 40 C18 50 16 56 14 60" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>

  <!-- Seated figure right (guest) -->
  <path d="M64 50 C64 46 66 42 68 40 C70 38 72 38 74 40" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="70" cy="36" r="4" stroke="currentColor" stroke-width="1.5"/>
  <path d="M70 32 L70 28" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Arm gesturing -->
  <path d="M66 40 C62 38 60 36 62 34" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M64 50 C66 52 68 56 66 60 M74 40 C76 50 74 56 72 60" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>

  <!-- Dancer (center top, arms raised) -->
  <circle cx="40" cy="16" r="4" stroke="currentColor" stroke-width="1.5"/>
  <path d="M40 12 L40 8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Arms raised V-shape with long sleeves -->
  <path d="M36 18 C28 14 22 10 18 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M44 18 C52 14 58 10 62 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Long sleeve tips -->
  <path d="M18 8 C14 6 12 8 14 10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M62 8 C66 6 68 8 66 10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Dancer torso + skirt -->
  <path d="M36 20 C38 26 42 28 44 20" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M36 20 C34 28 32 36 34 42 M44 20 C46 28 48 36 46 42" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Skirt hem (wide) -->
  <path d="M34 42 C36 44 40 44 46 42" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Musician (small figure far left) with drum -->
  <!-- Drum on stand -->
  <ellipse cx="4" cy="60" rx="3" ry="4" stroke="currentColor" stroke-width="1.2"/>
  <line x1="4" y1="56" x2="4" y2="52" stroke="currentColor" stroke-width="1"/>
  <!-- Drummer arms -->
  <path d="M6 58 C10 56 10 60 8 62" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Musician (small figure far right) with zheng/se -->
  <!-- String instrument horizontal -->
  <rect x="66" y="60" width="12" height="4" rx="1" stroke="currentColor" stroke-width="1"/>
  <!-- Strings -->
  <line x1="68" y1="60" x2="68" y2="64" stroke="currentColor" stroke-width="0.7"/>
  <line x1="70" y1="60" x2="70" y2="64" stroke="currentColor" stroke-width="0.7"/>
  <line x1="72" y1="60" x2="72" y2="64" stroke="currentColor" stroke-width="0.7"/>
  <line x1="74" y1="60" x2="74" y2="64" stroke="currentColor" stroke-width="0.7"/>
  <!-- Player hands -->
  <path d="M68 58 C66 56 66 60 68 60 M74 58 C76 56 76 60 74 60" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
</svg>
