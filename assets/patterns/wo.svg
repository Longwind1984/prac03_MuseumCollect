<!-- 涡纹 | 商代 | typical on: 尊 方器 觥 圈足 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Wo: swirling vortex/whirlpool — concentric arcs that spiral inward, often in clusters -->
  <!-- Distinct from yunlei: wo is round/curved, yunlei is square/angular -->

  <!-- Central large vortex -->
  <!-- Outer arc -->
  <path d="M40 8 C60 8 72 20 72 40 C72 60 60 72 40 72 C20 72 8 60 8 40 C8 20 20 8 40 8" stroke="currentColor" stroke-width="2"/>
  <!-- Second arc (partial, creating vortex) -->
  <path d="M40 14 C56 14 66 24 66 40 C66 56 56 66 40 66 C24 66 14 56 14 40 C14 24 24 14 40 14" stroke="currentColor" stroke-width="1.6"/>
  <!-- Third arc -->
  <path d="M40 20 C52 20 60 28 60 40 C60 52 52 60 40 60 C28 60 20 52 20 40 C20 28 28 20 40 20" stroke="currentColor" stroke-width="1.4"/>
  <!-- Fourth arc -->
  <path d="M40 26 C48 26 54 32 54 40 C54 48 48 54 40 54 C32 54 26 48 26 40 C26 32 32 26 40 26" stroke="currentColor" stroke-width="1.2"/>
  <!-- Fifth arc -->
  <path d="M40 32 C44 32 48 36 48 40 C48 44 44 48 40 48 C36 48 32 44 32 40 C32 36 36 32 40 32" stroke="currentColor" stroke-width="1"/>
  <!-- Center (eye of vortex) -->
  <circle cx="40" cy="40" r="4" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="40" cy="40" r="1.5" fill="currentColor"/>

  <!-- Vortex spiral entry line (breaks circle to create spiral effect) -->
  <path d="M40 8 C50 6 60 8 66 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <path d="M40 14 C48 12 56 14 62 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Corner mini-vortices (typical of Shang wo pattern in clusters) -->
  <!-- Top-left small vortex -->
  <path d="M14 14 C18 10 24 12 24 16 C24 20 18 20 16 18" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="18" cy="16" r="1.5" stroke="currentColor" stroke-width="1"/>
  <circle cx="18" cy="16" r="0.7" fill="currentColor"/>

  <!-- Top-right small vortex -->
  <path d="M66 14 C62 10 56 12 56 16 C56 20 62 20 64 18" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="62" cy="16" r="1.5" stroke="currentColor" stroke-width="1"/>
  <circle cx="62" cy="16" r="0.7" fill="currentColor"/>

  <!-- Bottom-left small vortex -->
  <path d="M14 66 C18 70 24 68 24 64 C24 60 18 60 16 62" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="18" cy="64" r="1.5" stroke="currentColor" stroke-width="1"/>
  <circle cx="18" cy="64" r="0.7" fill="currentColor"/>

  <!-- Bottom-right small vortex -->
  <path d="M66 66 C62 70 56 68 56 64 C56 60 62 60 64 62" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="62" cy="64" r="1.5" stroke="currentColor" stroke-width="1"/>
  <circle cx="62" cy="64" r="0.7" fill="currentColor"/>
</svg>
