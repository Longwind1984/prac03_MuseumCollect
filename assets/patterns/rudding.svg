<!-- 乳钉纹 | 商中期 | typical on: 鼎 瓿 方器 腹壁 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Rudding: raised round bosses in grid arrangement — the simplest Shang pattern -->
  <!-- Each boss = concentric rings suggesting raised dome + square frame -->
  <!-- Row 1 -->
  <rect x="8" y="8" width="18" height="18" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="17" cy="17" r="5" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="17" cy="17" r="2" fill="currentColor"/>

  <rect x="31" y="8" width="18" height="18" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="40" cy="17" r="5" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="40" cy="17" r="2" fill="currentColor"/>

  <rect x="54" y="8" width="18" height="18" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="63" cy="17" r="5" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="63" cy="17" r="2" fill="currentColor"/>

  <!-- Row 2 -->
  <rect x="8" y="31" width="18" height="18" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="17" cy="40" r="5" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="17" cy="40" r="2" fill="currentColor"/>

  <rect x="31" y="31" width="18" height="18" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="40" cy="40" r="5" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="40" cy="40" r="2" fill="currentColor"/>

  <rect x="54" y="31" width="18" height="18" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="63" cy="40" r="5" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="63" cy="40" r="2" fill="currentColor"/>

  <!-- Row 3 -->
  <rect x="8" y="54" width="18" height="18" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="17" cy="63" r="5" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="17" cy="63" r="2" fill="currentColor"/>

  <rect x="31" y="54" width="18" height="18" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="40" cy="63" r="5" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="40" cy="63" r="2" fill="currentColor"/>

  <rect x="54" y="54" width="18" height="18" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="63" cy="63" r="5" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="63" cy="63" r="2" fill="currentColor"/>
</svg>
