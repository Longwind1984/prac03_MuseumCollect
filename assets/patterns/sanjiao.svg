<!-- 三角纹 | 战国 | typical on: 壶 豆 器口沿 圈足 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Sanjiao: interlocking upward and downward pointing triangles in band arrangement -->
  <!-- Classic Warring States border/band pattern -->

  <!-- Band 1: row of up-triangles and down-triangles interlocked -->
  <path d="M4 28 L14 8 L24 28 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M24 8 L34 28 L14 28 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Inner fill lines for up-triangle 1 -->
  <line x1="10" y1="22" x2="18" y2="22" stroke="currentColor" stroke-width="0.8"/>
  <line x1="12" y1="16" x2="16" y2="16" stroke="currentColor" stroke-width="0.8"/>

  <path d="M24 28 L34 8 L44 28 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M44 8 L54 28 L34 28 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="30" y1="22" x2="38" y2="22" stroke="currentColor" stroke-width="0.8"/>
  <line x1="32" y1="16" x2="36" y2="16" stroke="currentColor" stroke-width="0.8"/>

  <path d="M44 28 L54 8 L64 28 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M64 8 L74 28 L54 28 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="50" y1="22" x2="58" y2="22" stroke="currentColor" stroke-width="0.8"/>
  <line x1="52" y1="16" x2="56" y2="16" stroke="currentColor" stroke-width="0.8"/>

  <!-- Band separator line -->
  <line x1="4" y1="34" x2="76" y2="34" stroke="currentColor" stroke-width="1.5"/>

  <!-- Band 2: inverted triangles -->
  <path d="M4 52 L14 72 L24 52 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M24 72 L34 52 L14 52 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="10" y1="58" x2="18" y2="58" stroke="currentColor" stroke-width="0.8"/>
  <line x1="12" y1="64" x2="16" y2="64" stroke="currentColor" stroke-width="0.8"/>

  <path d="M24 52 L34 72 L44 52 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M44 72 L54 52 L34 52 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="30" y1="58" x2="38" y2="58" stroke="currentColor" stroke-width="0.8"/>
  <line x1="32" y1="64" x2="36" y2="64" stroke="currentColor" stroke-width="0.8"/>

  <path d="M44 52 L54 72 L64 52 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M64 72 L74 52 L54 52 Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="50" y1="58" x2="58" y2="58" stroke="currentColor" stroke-width="0.8"/>
  <line x1="52" y1="64" x2="56" y2="64" stroke="currentColor" stroke-width="0.8"/>

  <!-- Bottom line -->
  <line x1="4" y1="46" x2="76" y2="46" stroke="currentColor" stroke-width="1.5"/>
</svg>
