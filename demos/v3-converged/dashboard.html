<style>
:root {
  --bg-dark:       #12100c;
  --bg-panel:      #1a1510;
  --bg-card:       #201c14;
  --text-gold:     #d4a857;
  --text-bronze:   #a4732c;
  --text-cream:    #e8dcc8;
  --text-muted:    #b0a070;
  --border-dim:    rgba(164,115,44,0.18);
  --border-bright: rgba(212,168,87,0.45);
  --accent-red:    #c04030;
  --xia-c:    #6e4a2e;
  --shang-c:  #4a5a3a;
  --xizhou-c: #a73a2a;
  --chunqiu-c:#2a2a3a;
  --zhanguo-c:#7a3a2a;
  --qin-c:    #1a1a1a;
  --xihan-c:  #b89046;
  --donghan-c:#9a7838;
  --PILLAR_W: 200px;
  --MAP_W:    460px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Noto Serif SC', '宋体', serif;
  background: var(--bg-dark);
  color: var(--text-cream);
  display: flex;
  flex-direction: column;
}

/* ── NAV ── */
.top-nav {
  height: 48px; min-height: 48px;
  background: rgba(26,21,16,0.97);
  border-bottom: 1px solid var(--border-dim);
  display: flex; align-items: center; padding: 0 20px; gap: 0;
  flex-shrink: 0; z-index: 200;
}
.nav-logo {
  font-size: 16px; font-weight: 700; color: var(--text-cream);
  text-decoration: none; margin-right: 24px; white-space: nowrap;
}
.nav-logo span { color: var(--text-bronze); }
.nav-links { display: flex; gap: 0; flex: 1; overflow: hidden; }
.nav-link {
  padding: 0 12px; height: 48px; display: flex; align-items: center;
  font-size: 12px; color: var(--text-muted); text-decoration: none;
  border-bottom: 2px solid transparent; transition: all .2s; white-space: nowrap;
}
.nav-link:hover { color: var(--text-bronze); border-bottom-color: var(--text-bronze); }
.nav-link.active { color: var(--text-gold); border-bottom-color: var(--text-gold); }
.linkage-badge {
  margin-left: auto; padding: 4px 12px; border-radius: 20px;
  font-size: 11px; border: 1px solid var(--border-bright); color: var(--text-gold);
  background: rgba(212,168,87,0.08); cursor: pointer; display: flex; align-items: center; gap: 6px;
  white-space: nowrap; transition: all .2s;
}
.linkage-badge:hover { background: rgba(212,168,87,0.16); }
.linkage-dot { width: 7px; height: 7px; border-radius: 50%; background: #4aed4a; flex-shrink: 0; }
.linkage-dot.off { background: #666; }

/* ── LAYOUT ── */
.dashboard-layout {
  flex: 1; display: grid; min-height: 0;
  /* Left: time-pillar  |  Right: map + pattern-strip */
  grid-template-columns: 240px 1fr;
  grid-template-rows: 1fr;
  gap: 0;
}

/* Mobile: single column, vertical stack (time-pillar → map → bottom-panel) */
@media (max-width: 768px) {
  body, html { height: auto !important; overflow-y: auto !important; }
  .dashboard-layout {
    display: flex !important;
    flex-direction: column !important;
    height: auto !important;
  }
  .left-col {
    border-right: none !important;
    border-bottom: 1px solid var(--border-dim);
    flex: none !important;
  }
  .pillar-section { max-height: 360px; overflow-y: auto !important; }
  .pattern-strip-section { padding: 8px 12px; }
  .right-col { flex: none !important; min-height: 0; }
  .map-section { height: 280px !important; min-height: 280px; }
  .bottom-panel { flex-direction: column !important; }
  .era-big-badge { width: 100% !important; }
  .era-separator { display: none; }
  .artifact-cards { flex-wrap: nowrap; overflow-x: auto !important; }
}

/* Left column: time-pillar + pattern strip stacked */
.left-col {
  display: flex; flex-direction: column;
  border-right: 1px solid var(--border-dim);
  min-height: 0;
}
.pillar-section {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 0 0 0 0;
  min-height: 0;
}
.pillar-section::-webkit-scrollbar { width: 4px; }
.pillar-section::-webkit-scrollbar-thumb { background: var(--border-dim); }

.pattern-strip-section {
  flex-shrink: 0;
  height: 110px;
  border-top: 1px solid var(--border-dim);
  background: rgba(26,21,16,0.6);
  padding: 8px 10px 6px;
  overflow: hidden;
}
.pattern-strip-label {
  font-size: 9px; color: var(--text-muted); letter-spacing: .12em;
  text-transform: uppercase; margin-bottom: 6px;
}
.pattern-strip {
  display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
  scrollbar-width: thin;
}
.pattern-strip::-webkit-scrollbar { height: 3px; }
.pattern-strip::-webkit-scrollbar-thumb { background: var(--border-dim); }
.pattern-node {
  flex-shrink: 0; width: 56px; text-align: center;
  transition: all .25s ease;
  cursor: pointer;
}
.pattern-node img {
  width: 40px; height: 40px; display: block; margin: 0 auto 4px;
  border-radius: 4px; border: 1px solid var(--border-dim);
  transition: all .25s ease;
  filter: brightness(0.5) sepia(1);
  background: rgba(255,255,255,0.02);
}
.pattern-node.highlighted img {
  filter: brightness(1) sepia(0.3) saturate(2);
  border-color: var(--text-gold);
  box-shadow: 0 0 10px rgba(212,168,87,0.5);
  transform: scale(1.1);
}
.pattern-node.dominant img {
  filter: brightness(1.2) sepia(0.1) saturate(2.5);
  border-color: #f0d070;
  box-shadow: 0 0 14px rgba(240,208,112,0.7);
  transform: scale(1.15);
}
.pattern-node-name {
  font-size: 9px; color: var(--text-muted); line-height: 1.2;
  transition: color .25s;
}
.pattern-node.highlighted .pattern-node-name,
.pattern-node.dominant .pattern-node-name {
  color: var(--text-gold);
}

/* Right column: map + bottom panel */
.right-col {
  display: flex; flex-direction: column;
  min-height: 0; min-width: 0;
}
.map-section {
  flex: 1; position: relative; min-height: 0; overflow: hidden;
}
.map-header {
  position: absolute; top: 12px; left: 16px; z-index: 10;
  font-size: 10px; color: var(--text-muted); letter-spacing: .12em;
  text-transform: uppercase;
}
.map-era-badge {
  position: absolute; top: 10px; right: 16px; z-index: 10;
  padding: 4px 14px; border-radius: 4px;
  font-size: 13px; font-weight: 600; color: var(--text-gold);
  border: 1px solid var(--border-bright);
  background: rgba(26,21,16,0.9);
  transition: all .3s ease;
}
#map-svg {
  width: 100%; height: 100%;
}
/* Map region polygons */
.state-region {
  transition: opacity .4s ease, fill .4s ease;
  cursor: default;
}
.state-region.hidden { opacity: 0 !important; pointer-events: none; }
.state-region.visible { opacity: 1; }
/* Site dots */
.site-dot {
  transition: r .3s ease, fill .3s ease, opacity .3s ease;
  cursor: pointer;
}
.site-dot:hover { opacity: 1 !important; }
.site-label {
  font-family: 'Noto Serif SC', serif;
  pointer-events: none;
  transition: opacity .3s ease;
}

/* Bottom panel */
.bottom-panel {
  flex-shrink: 0;
  height: 130px;
  border-top: 1px solid var(--border-dim);
  background: rgba(26,21,16,0.9);
  padding: 12px 20px;
  display: flex; gap: 20px; align-items: center;
  overflow: hidden;
}
.era-big-badge {
  flex-shrink: 0;
  text-align: center;
  min-width: 80px;
}
.era-big-name {
  font-size: 32px; font-weight: 700; line-height: 1;
  transition: color .3s ease;
}
.era-big-period {
  font-size: 10px; color: var(--text-muted); margin-top: 4px;
  line-height: 1.4;
}
.era-big-count {
  font-size: 12px; margin-top: 6px;
}
.era-separator {
  width: 1px; height: 80px; background: var(--border-dim); flex-shrink: 0;
}
.artifact-cards {
  display: flex; gap: 10px; overflow-x: auto; flex: 1;
  scrollbar-width: thin; padding-bottom: 4px;
  align-items: center;
}
.artifact-cards::-webkit-scrollbar { height: 3px; }
.artifact-cards::-webkit-scrollbar-thumb { background: var(--border-dim); }
.artifact-card-mini {
  flex-shrink: 0; width: 70px; text-align: center; cursor: pointer;
  transition: transform .2s;
}
.artifact-card-mini:hover { transform: translateY(-3px); }
.artifact-card-mini img {
  width: 50px; height: 50px; object-fit: contain; display: block; margin: 0 auto 4px;
  border-radius: 4px; border: 1px solid var(--border-dim);
  filter: sepia(0.5) brightness(0.8);
}
.artifact-card-mini.treasure img {
  border-color: var(--text-gold);
  box-shadow: 0 0 8px rgba(212,168,87,0.4);
  filter: sepia(0.2) brightness(0.9);
}
.artifact-card-mini .card-name {
  font-size: 9px; color: var(--text-muted); line-height: 1.2;
}
.artifact-card-mini .rarity-halo {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  margin-right: 2px; vertical-align: middle;
}

/* Time pillar (inlined D3 target) */
#pillar-container {
  padding: 8px 6px 8px 4px;
  min-height: 0;
}
/* Pillar title */
.pillar-title {
  font-size: 9px; color: var(--text-muted); letter-spacing: .1em;
  text-transform: uppercase; padding: 8px 10px 4px;
  border-bottom: 1px solid var(--border-dim);

/* Dynasty band styles */
.dynasty-band-g { cursor: pointer; }
.dynasty-band-g:hover .band-bg { opacity: 1 !important; }
.dynasty-band-g .band-highlight { opacity: 0; transition: opacity .2s; }
.dynasty-band-g.active .band-highlight { opacity: 1 !important; }
.dynasty-band-g.active .band-bg { opacity: 1 !important; }

/* Event markers */
.event-dot { cursor: pointer; }
.event-dot:hover { r: 5; }

/* Breathing animation for empty bands */
@keyframes breathe {
  0%, 100% { opacity: 0.3; }
  50%       { opacity: 0.65; }
}
.breath-anim { animation: breathe 4s ease-in-out infinite; }

/* Transition ring for reactions */
@keyframes pulse-ring {
  0%   { transform: scale(1);   opacity: 0.8; }
  100% { transform: scale(1.4); opacity: 0; }
}
.pulse-ring { animation: pulse-ring 0.6s ease-out forwards; }

/* Map tooltip */
.map-tooltip {
  position: fixed; z-index: 9999;
  background: rgba(26,21,16,0.96); border: 1px solid var(--border-bright);
  border-radius: 4px; padding: 8px 12px; font-size: 12px; color: var(--text-cream);
  pointer-events: none; max-width: 200px; line-height: 1.6;
  opacity: 0; transition: opacity .15s ease;

/* Linkage reaction flash */
@keyframes flash-linkage {
  0%   { box-shadow: 0 0 0 0 rgba(212,168,87,0); }
  30%  { box-shadow: 0 0 20px 4px rgba(212,168,87,0.5); }
  100% { box-shadow: 0 0 0 0 rgba(212,168,87,0); }
}
.flash-react { animation: flash-linkage 0.7s ease-out; }

/* Debug indicator */
.debug-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(10,8,5,0.92); border-top: 1px solid var(--border-dim);

}
.debug-bar.visible { display: block; }
#debug-log { color: #7a9060; }

<script>
// ============================================================
//  INLINE EVENT BUS (same contract as event-bus.js)
// ============================================================
const bus = {
  emit(name, payload) {
    document.dispatchEvent(new CustomEvent(name, { detail: payload, bubbles: false }));
    _debugLog('→ ' + name + ' : ' + JSON.stringify(payload).slice(0, 120));
  },
  on(name, handler) {
    const w = e => handler(e.detail);
    document.addEventListener(name, w);
    return () => document.removeEventListener(name, w);
  }
};
window.MuseumBus = bus;

let _linkageEnabled = true;
function _debugLog(msg) {
  const el = document.getElementById('debug-log');
  if (el) el.textContent = new Date().toLocaleTimeString() + ' ' + msg;
}

// Show debug bar if ?debug
if (new URLSearchParams(location.search).has('debug')) {
  document.getElementById('debug-bar').classList.add('visible');
}

// Linkage toggle
document.getElementById('linkage-toggle').addEventListener('click', () => {
  _linkageEnabled = !_linkageEnabled;
  const dot = document.getElementById('linkage-dot');
  const label = document.getElementById('linkage-label');
  dot.classList.toggle('off', !_linkageEnabled);
  label.textContent = _linkageEnabled ? '联动 ON' : '联动 OFF';
});

// ============================================================
//  TIME PILLAR (Inline D3 implementation)
// ============================================================

let _activeEra = null;
let _lockedEra = null;

function buildTimePillar() {
  const container = document.getElementById('pillar-container');
  const containerWidth = 230; // left col is 240px

  // Total years for height calculation
  const PX_PER_YEAR = 0.52;
  const MIN_H = 24;

  // Compute layout
  let yOff = 0;
  const layouts = DYNASTIES.map(d => {
    const h = Math.max(d.dur * PX_PER_YEAR, MIN_H);
    const r = { ...d, y: yOff, h };
    yOff += h;
    return r;
  });
  const totalH = yOff;

  const PILLAR_W = 140;
  const AXIS_W = 50;
  const svgW = containerWidth;
  const svgH = totalH + 20;

  const svg = d3.select(container)
    .append('svg')
    .attr('width', svgW)
    .attr('height', svgH)
    .attr('viewBox', `0 0 ${svgW} ${svgH}`)
    .style('display', 'block');

  const defs = svg.append('defs');
  // Breath gradient
  const bg = defs.append('linearGradient').attr('id','breath-grad')
    .attr('x1','0%').attr('y1','0%').attr('x2','0%').attr('y2','100%');
  bg.append('stop').attr('offset','0%').attr('stop-color','#3a3a3a').attr('stop-opacity','0.15');
  bg.append('stop').attr('offset','100%').attr('stop-color','#3a3a3a').attr('stop-opacity','0.05');

  // Gold glow filter
  const glow = defs.append('filter').attr('id','glow-gold-p');
  glow.append('feGaussianBlur').attr('stdDeviation','2').attr('result','b');
  const m = glow.append('feMerge');
  m.append('feMergeNode').attr('in','b');
  m.append('feMergeNode').attr('in','SourceGraphic');

  const g = svg.append('g').attr('transform', `translate(${AXIS_W},10)`);

  layouts.forEach(d => {
    const density = d.collected / d.pool;
    const isEmpty = d.collected === 0;
    const baseColor = d.color;
    const fillOp = isEmpty ? 0.18 : 0.25 + density * 0.6;

    const bandG = g.append('g')
      .attr('class', 'dynasty-band-g')
      .attr('data-dynasty', d.name)
      .style('cursor', 'pointer');

    // Main rect
    bandG.append('rect')
      .attr('class', 'band-bg')
      .attr('x', 0).attr('y', d.y)
      .attr('width', PILLAR_W).attr('height', d.h)
      .attr('fill', baseColor)
      .attr('fill-opacity', fillOp)
      .attr('stroke', baseColor)
      .attr('stroke-opacity', 0.4)
      .attr('stroke-width', 0.5)
      .style('transition', 'fill-opacity 0.2s');

    // Density bar (left edge)
    if (!isEmpty) {
      bandG.append('rect')
        .attr('x', 0).attr('y', d.y + d.h * (1 - density))
        .attr('width', 4).attr('height', d.h * density)
        .attr('fill', baseColor).attr('fill-opacity', 0.9).attr('rx', 1);
    }

    // Breath overlay for empty
    if (isEmpty) {
      bandG.append('rect')
        .attr('class', 'breath-anim')
        .attr('x', 0).attr('y', d.y)
        .attr('width', PILLAR_W).attr('height', d.h)
        .attr('fill', 'url(#breath-grad)');
    }

    // Highlight rect (visible on hover/active)
    bandG.append('rect')
      .attr('class', 'band-highlight')
      .attr('x', 0).attr('y', d.y)
      .attr('width', PILLAR_W).attr('height', d.h)
      .attr('fill', 'none')
      .attr('stroke', '#e8d8b8')
      .attr('stroke-width', 1.5)
      .attr('opacity', 0)
      .style('pointer-events', 'none')
      .style('transition', 'opacity 0.15s');

    // Dynasty name
    const labelSz = d.h > 50 ? 13 : d.h > 30 ? 11 : 9;
    bandG.append('text')
      .attr('x', 10).attr('y', d.y + Math.min(d.h / 2, 22))
      .attr('dominant-baseline', 'middle')
      .attr('fill', '#e8d8c8').attr('fill-opacity', 0.9)
      .attr('font-size', labelSz)
      .attr('font-family', 'Noto Serif SC, STSong, serif')
      .attr('letter-spacing', '1')
      .text(d.name);

    // Duration label
    if (d.h > 36) {
      bandG.append('text')
        .attr('x', 10).attr('y', d.y + Math.min(d.h / 2 + 14, 38))
        .attr('dominant-baseline', 'middle')
        .attr('fill', baseColor).attr('fill-opacity', 0.6)
        .attr('font-size', '8').attr('font-family', 'monospace')
        .text(`${d.dur}yr`);
    }

    // Collection badge
    if (d.h > 24) {
      bandG.append('text')
        .attr('x', PILLAR_W - 6).attr('y', d.y + 12)
        .attr('text-anchor', 'end')
        .attr('fill', isEmpty ? '#5a4a3a' : '#c8a860')
        .attr('font-size', '8').attr('font-family', 'monospace')
        .text(`${d.collected}/${d.pool}`);
    }

    // Dominant pattern text at bottom of tall bands
    if (d.h > 70 && d.dominant_patterns) {
      bandG.append('text')
        .attr('x', 8).attr('y', d.y + d.h - 8)
        .attr('fill', baseColor).attr('fill-opacity', 0.5)
        .attr('font-size', '7')
        .attr('font-family', 'Noto Serif SC, STSong, serif')
        .text(d.dominant_patterns.slice(0,2).join(' · '));
    }

    // Hover / click
    bandG
      .on('mouseenter', (event) => {
        if (!_lockedEra) onPillarHover(d);
      })
      .on('mouseleave', () => {
        if (!_lockedEra) onPillarLeave();
      })
      .on('click', () => {
        _lockedEra = (_lockedEra === d.name) ? null : d.name;
        if (_lockedEra) onPillarHover(d);
        else onPillarLeave();
      });
  });

  // Axis (left side, year ticks)
  const axisG = svg.append('g').attr('transform', `translate(0,10)`);
  layouts.forEach(d => {
    const yr = d.start;
    const label = yr < 0 ? `前${Math.abs(yr)}` : `${yr}`;
    axisG.append('line')
      .attr('x1', AXIS_W - 4).attr('x2', AXIS_W).attr('y1', d.y).attr('y2', d.y)
      .attr('stroke', '#5a4a3a').attr('stroke-width', 0.5);
    axisG.append('text')
      .attr('x', AXIS_W - 6).attr('y', d.y + 3)
      .attr('text-anchor', 'end')
      .attr('fill', '#7a6a4a').attr('font-size', '7').attr('font-family', 'monospace')
      .text(label);
  });
  // Last tick
  const last = layouts[layouts.length - 1];
  const lastYr = last.end;
  const lastLabel = lastYr > 0 ? `${lastYr}AD` : `前${Math.abs(lastYr)}`;
  axisG.append('text')
    .attr('x', AXIS_W - 6).attr('y', last.y + last.h + 3)
    .attr('text-anchor', 'end')
    .attr('fill', '#7a6a4a').attr('font-size', '7').attr('font-family', 'monospace')
    .text(lastLabel);

  return { layouts };
}

function onPillarHover(d) {
  _activeEra = d.name;
  updatePillarHighlight(d.name);
  // Emit era-focus — other components react
  bus.emit('era-focus', {
    dynasty: d.name,
    dominant_patterns: d.dominant_patterns,
    collected: d.collected,
    geo_era: d.geo_era,
    triggered_by: 'time-pillar'
  });
}
function onPillarLeave() {
  if (_lockedEra) return;
  _activeEra = null;
  updatePillarHighlight(null);
  // Don't clear other components; let them show last active state
}

function updatePillarHighlight(name) {
  d3.selectAll('.dynasty-band-g').each(function() {
    const dn = this.getAttribute('data-dynasty');
    const isActive = dn === name;
    this.setAttribute('class', isActive ? 'dynasty-band-g active' : 'dynasty-band-g');
    const highlight = d3.select(this).select('.band-highlight');
    const bg = d3.select(this).select('.band-bg');
    if (isActive) {
      highlight.attr('opacity', 1);
      bg.attr('fill-opacity', 0.85);
      d3.select(this).raise();
    } else {
      highlight.attr('opacity', 0);
      const dData = DYNASTIES.find(x => x.name === dn);
      if (dData) {
        const density = dData.collected / dData.pool;
        bg.attr('fill-opacity', dData.collected === 0 ? 0.18 : 0.25 + density * 0.6);
      }
    }
  });
}

//  GEO MAP (Inline D3 SVG map)
// ============================================================

let _currentGeoEra = null;
let _mapProjection = null;
let _mapGeoPath = null;
let _realGeo = {}; // { terrain, shang, xizhou, chunqiu, zhanguo } once fetched

async function loadRealGeoData() {
  const eras = ['shang', 'xizhou', 'chunqiu', 'zhanguo'];
  try {
    const [terrain, ...states] = await Promise.all([
      fetch('../../assets/geo/china-terrain.geojson').then(r => r.json()),
      ...eras.map(e => fetch(`../../assets/geo/ancient-states-${e}.geojson`).then(r => r.json()))
    ]);
    _realGeo.terrain = terrain;
    eras.forEach((e, i) => { _realGeo[e] = states[i]; });
    // Rebuild map with real geo data
    buildMap();
    if (_currentGeoEra) renderEra(_currentGeoEra);
  } catch (e) {
    console.warn('[GeoData] fetch failed, keeping inline fallback:', e.message);
  }
}

function buildMap() {
  const section = document.getElementById('map-section');
  const W = section.offsetWidth || 700;
  const H = section.offsetHeight || 480;

  const svg = d3.select('#map-svg')
    .attr('width', W)
    .attr('height', H);
  svg.selectAll('*').remove();

  const padX = 30, padY = 20;

  // Use d3.geoConicEqualArea for China-friendly projection if real geo is loaded,
  // else fall back to simple linear projection on inline lon/lat.
  if (_realGeo.terrain) {
    _mapProjection = d3.geoConicEqualArea()
      .parallels([25, 47])
      .rotate([-105, 0])
      .fitExtent([[padX, padY], [W - padX, H - padY]], _realGeo.terrain);
    _mapGeoPath = d3.geoPath(_mapProjection);
  } else {
    const lonMin=96, lonMax=128, latMin=23, latMax=44;
    const scaleX = (W - padX*2) / (lonMax - lonMin);
    const scaleY = (H - padY*2) / (latMax - latMin);
    const scale = Math.min(scaleX, scaleY);
    _mapProjection = ([lon, lat]) => [
      padX + (lon - lonMin) * scale,
      H - padY - (lat - latMin) * scale  // flip Y
    ];
    // Construct a minimal GeoPath-compatible drawer for inline coord arrays
    _mapGeoPath = null;
  }

  // Background
  svg.append('rect').attr('x',0).attr('y',0).attr('width',W).attr('height',H)
    .attr('fill', '#0e0c08');

  // Simple China outline (simplified polygon for "recognizable as China")
  const chinaOutlineCoords = [
    [73.5,39.5],[76,37],[80,35],[83,33],[84,28],[88,27],[90,26.5],[92,27],[94,28],
    [97,27.5],[100,22],[102,22],[104,21.5],[106,22],[108,21],[110,20],[112,20.5],
    [114,22],[116,23],[118,24],[120,24.5],[121.5,25],[122,27],[121,28.5],
    [121.5,30],[122,31],[122,32],[121.5,33],[120.5,34],[121,36],[122,37],
    [121.5,39],[122,40.5],[120,41],[118,42],[116,43],[115,44],[113,44],
    [111,44.5],[109,44],[107,43.5],[105,42.5],[102,42],[100,41],[98,41],
    [96,40.5],[94,41],[92,42],[90,43],[88,44],[85,44.5],[82,44],[80,43.5],
    [78,42],[76,41],[73.5,41],[73.5,39.5]
  ];
  // Use real China terrain if loaded; else linear-projected inline polygon.
  if (_realGeo.terrain && _mapGeoPath) {
    svg.append('path').datum(_realGeo.terrain).attr('d', _mapGeoPath)
      .attr('fill', '#1a1f14').attr('stroke', '#3a4a2a').attr('stroke-width', 1)
      .attr('fill-opacity', 0.6);
  } else {
    const chinaPath = 'M' + chinaOutlineCoords.map(c => _mapProjection(c).map(v=>v.toFixed(1)).join(',')).join(' L') + ' Z';
    svg.append('path').attr('d', chinaPath)
      .attr('fill', '#1a1f14').attr('stroke', '#3a4a2a').attr('stroke-width', 1)
      .attr('fill-opacity', 0.6);
  }

  // Major rivers
  const yellowRiver = [
    [96,35.5],[100,36],[103,35.5],[105,35],[107,34.5],[109,35],[111,35.5],
    [112,35],[113,35.5],[114.5,35],[115.5,35.5],[117,37],[119,38]
  ];
  const yangtzeRiver = [
    [98,28],[102,29],[104,29.5],[106,29.5],[108,30.5],[111,30],[113,29.5],
    [116,29.5],[118,29.5],[120,30],[121.5,31.5]
  ];

  const riverPath = (pts) => 'M' + pts.map(c => _mapProjection(c).map(v=>v.toFixed(1)).join(',')).join(' L');
  svg.append('path').attr('d', riverPath(yellowRiver))
    .attr('fill','none').attr('stroke','#2a5a8a').attr('stroke-width',1.5).attr('stroke-opacity',0.4);
  svg.append('path').attr('d', riverPath(yangtzeRiver))
    .attr('fill','none').attr('stroke','#2a6a9a').attr('stroke-width',1.5).attr('stroke-opacity',0.35);

  // River labels
  const yrMid = _mapProjection([110, 35.2]);
  const ytzMid = _mapProjection([113, 29.3]);
  svg.append('text').attr('x', yrMid[0]).attr('y', yrMid[1])
    .attr('fill','#2a5a8a').attr('fill-opacity',0.6).attr('font-size','8')
    .attr('font-family','Noto Serif SC,serif').text('黄河');
  svg.append('text').attr('x', ytzMid[0]).attr('y', ytzMid[1])
    .attr('fill','#2a6a9a').attr('fill-opacity',0.6).attr('font-size','8')
    .attr('font-family','Noto Serif SC,serif').text('长江');

  // Group for era regions (toggled per era)
  const regionsG = svg.append('g').attr('id','map-regions-group');

  // Group for sites (always visible, react to era)
  const sitesG = svg.append('g').attr('id','map-sites-group');

  // Build all era regions (hidden initially)
  // Prefer real GeoJSON when loaded; fall back to inline GEO_DATA polygons.
  Object.keys(GEO_DATA).forEach(eraKey => {
    const era = GEO_DATA[eraKey];
    const eraG = regionsG.append('g').attr('class', `era-group era-${eraKey} hidden`);

    const useReal = _realGeo[eraKey] && _mapGeoPath;
    const features = useReal
      ? _realGeo[eraKey].features
      : era.regions.map(r => ({
          // Wrap inline polygons in GeoJSON-like envelope for unified rendering
          properties: { name: r.name, color: r.color, opacity: r.opacity, id: r.id, _inline: true },
          _coords: r.coords
        }));

    features.forEach(feature => {
      const p = feature.properties || {};
      const id = p.id || (feature.id || '').toString().toLowerCase().replace(/[^a-z0-9]/g, '-');
      const color = p.color || '#888';
      const opacity = p.opacity != null ? p.opacity : 0.35;
      const name = p.name || '';
      let pathStr;
      let labelLon, labelLat;
      if (useReal) {
        pathStr = _mapGeoPath(feature);
        const c = d3.geoCentroid(feature);
        [labelLon, labelLat] = c;
      } else {
        const coords = feature._coords;
        pathStr = 'M' + coords.map(c => _mapProjection(c).map(v=>v.toFixed(1)).join(',')).join(' L') + ' Z';
        const sum = coords.reduce((acc, c) => [acc[0]+c[0], acc[1]+c[1]], [0,0]);
        labelLon = sum[0] / coords.length;
        labelLat = sum[1] / coords.length;
      }
      eraG.append('path')
        .attr('class', 'state-region')
        .attr('id', `region-${eraKey}-${id}`)
        .attr('d', pathStr)
        .attr('fill', color)
        .attr('fill-opacity', opacity)
        .attr('stroke', color)
        .attr('stroke-opacity', 0.55)
        .attr('stroke-width', 1)
        .attr('stroke-dasharray', '4,3');

      const [lx, ly] = _mapProjection([labelLon, labelLat]);
      eraG.append('text')
        .attr('x', lx).attr('y', ly)
        .attr('text-anchor', 'middle')
        .attr('dominant-baseline', 'middle')
        .attr('fill', color)
        .attr('fill-opacity', 0.85)
        .attr('font-size', '9')
        .attr('font-family', 'Noto Serif SC, serif')
        .attr('letter-spacing', '1')
        .style('pointer-events', 'none')
        .text(name);
    });
  });

  // Render all site dots (across all eras)
  const allSites = [];
  Object.keys(GEO_DATA).forEach(eraKey => {
    GEO_DATA[eraKey].sites.forEach(site => allSites.push({ ...site, eraKey }));
  });
  // Deduplicate by id (same site may appear in multiple eras)
  const seenSites = new Set();
  const uniqueSites = allSites.filter(s => {
    if (seenSites.has(s.id)) return false;
    seenSites.add(s.id);
    return true;
  });

  uniqueSites.forEach(site => {
    const [sx, sy] = _mapProjection([site.x, site.y]);
    const siteG = sitesG.append('g')
      .attr('class', `site-group site-${site.id}`)
      .attr('data-site', site.id)
      .attr('data-era', site.eraKey)
      .style('opacity', 0.35);

    siteG.append('circle')
      .attr('class', 'site-dot')
      .attr('cx', sx).attr('cy', sy)
      .attr('r', site.collected ? site.r : site.r * 0.7)
      .attr('fill', site.collected ? '#c8a860' : '#5a5a4a')
      .attr('fill-opacity', site.collected ? 0.85 : 0.4)
      .attr('stroke', site.collected ? '#f0d080' : '#6a6a5a')
      .attr('stroke-width', site.collected ? 1.5 : 0.5)
      .style('transition', 'r .3s, fill .3s');

    // Label
    siteG.append('text')
      .attr('class', 'site-label')
      .attr('x', sx + 8).attr('y', sy + (site.dy || 0) * 0.5)
      .attr('fill', site.collected ? '#d4a857' : '#7a7a5a')
      .attr('font-size', '9')
      .attr('font-family', 'Noto Serif SC, serif')
      .style('pointer-events', 'none')
      .text(site.name);

    // Interaction
    const tooltip = document.getElementById('map-tooltip');
    siteG
      .on('mouseenter', (event) => {
        tooltip.innerHTML = `<strong style="color:#d4a857">${site.name}</strong><br><span style="font-size:11px;color:#9a8060">${site.dynasty} · ${site.collected ? '已收藏器物' : '待探索'}</span><br><span style="font-size:11px">${site.desc}</span>`;
        tooltip.style.opacity = '1';
        tooltip.style.left = (event.clientX + 12) + 'px';
        tooltip.style.top = (event.clientY - 8) + 'px';
      })
      .on('mousemove', (event) => {
        tooltip.style.left = (event.clientX + 12) + 'px';
        tooltip.style.top = (event.clientY - 8) + 'px';
      })
      .on('mouseleave', () => { tooltip.style.opacity = '0'; });
  });
}

function showMapEra(eraKey) {
  // Hide all era groups
  d3.selectAll('.era-group').classed('hidden', true);
  // Show target era
  if (eraKey) {
    d3.selectAll(`.era-${eraKey}`).classed('hidden', false);
  }
  // Update site visibility: highlight sites for this era
  d3.selectAll('.site-group').each(function() {
    const siteEra = this.getAttribute('data-era');
    if (!eraKey || siteEra === eraKey) {
      d3.select(this).style('opacity', 1)
        .select('.site-dot').attr('r', function() {
          const siteId = this.parentElement.getAttribute('data-site');
          const allSites = Object.values(GEO_DATA).flatMap(e => e.sites);
          const site = allSites.find(s => s.id === siteId);
          return site ? (site.collected ? site.r * 1.2 : site.r * 0.8) : 5;
        });
    } else {
      d3.select(this).style('opacity', 0.18);
    }
  });

  // Flash the map section
  if (eraKey) {
    const mapSec = document.getElementById('map-section');
    mapSec.classList.remove('flash-react');
    void mapSec.offsetWidth; // force reflow
    mapSec.classList.add('flash-react');
  }
}

// ============================================================
//  PATTERN STRIP
// ============================================================

function buildPatternStrip() {
  const strip = document.getElementById('pattern-strip');
  strip.innerHTML = '';
  PATTERNS.forEach(p => {
    const node = document.createElement('div');
    node.className = 'pattern-node';
    node.dataset.slug = p.slug;
    node.dataset.eras = JSON.stringify(p.eras);
    node.innerHTML = `
      <img src="${PATTERN_PATH}${p.slug}.svg" alt="${p.name}" title="${p.name}"
           onerror="this.style.background='rgba(100,80,40,0.3)';this.src='';this.alt='${p.name[0]}'">
      <div class="pattern-node-name">${p.name}</div>
    `;
    strip.appendChild(node);
  });
}

function updatePatternStrip(dynastyName, dominantPatterns) {
  const stripSection = document.getElementById('pattern-strip-section');
  stripSection.classList.remove('flash-react');
  void stripSection.offsetWidth;
  stripSection.classList.add('flash-react');

  const eraLabel = document.getElementById('pattern-strip-era-label');
  eraLabel.textContent = dynastyName
    ? `纹饰演化 · ${dynastyName}代主流 (金=主导纹饰)`
    : '纹饰演化 · Patterns';

  const dominantSet = new Set(dominantPatterns || []);

  document.querySelectorAll('.pattern-node').forEach(node => {
    const slug = node.dataset.slug;
    const eras = JSON.parse(node.dataset.eras || '[]');
    const isDominant = dominantSet.has(slug) ||
      (dominantPatterns && dominantPatterns.some(p => p.includes(slug.slice(0,4))));
    const isEraMatch = eras.includes(dynastyName);

    node.classList.remove('highlighted', 'dominant');
    if (isDominant) {
      node.classList.add('dominant');
      // Scroll dominant pattern into view
      node.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    } else if (isEraMatch) {
      node.classList.add('highlighted');
    }
  });
}

// ============================================================
//  BOTTOM PANEL
// ============================================================

function updateBottomPanel(dynasty) {
  const bottomPanel = document.getElementById('bottom-panel');
  bottomPanel.classList.remove('flash-react');
  void bottomPanel.offsetWidth;
  bottomPanel.classList.add('flash-react');

  const bigName = document.getElementById('era-big-name');
  const bigPeriod = document.getElementById('era-big-period');
  const bigCount = document.getElementById('era-big-count');
  const cardsEl = document.getElementById('artifact-cards');

  bigName.textContent = dynasty.name;
  bigName.style.color = dynasty.color;
  bigPeriod.textContent = dynasty.desc;

  const pct = Math.round((dynasty.collected / dynasty.pool) * 100);
  bigCount.innerHTML = `<span style="color:${dynasty.color};font-weight:600;">${dynasty.collected}</span>` +
    `<span style="color:var(--text-muted);"> / ${dynasty.pool} 件 · ${pct}%</span>`;

  // Render artifact cards
  cardsEl.innerHTML = '';
  if (dynasty.artifacts && dynasty.artifacts.length > 0) {
    dynasty.artifacts.forEach(artifact => {
      const card = document.createElement('div');
      card.className = 'artifact-card-mini' + (artifact.treasure ? ' treasure' : '');

      // Rarity halo color
      const rarityColors = {
        'tier-treasure': '#d4a857',
        'tier-1': '#a4732c',
        'tier-2': '#6b4a8a',
        'tier-3': '#666'
      };
      const rarityColor = rarityColors[artifact.rarity] || '#666';

      // Photo-first: real photo at assets/photos/<id>.jpg if available, else silhouette
      const photoUrl = (window.MuseumData && window.MuseumData.getPhotoUrl) ? window.MuseumData.getPhotoUrl(artifact.id, '../../') : null;
      const imgSrc = photoUrl || (SILHOUETTE_PATH + artifact.silhouette + '.svg');
      const imgStyle = photoUrl ? 'width:100%;height:100%;object-fit:cover;' : '';
      card.innerHTML = `
        <img src="${imgSrc}"
             style="${imgStyle}"
             alt="${artifact.name}"
             onerror="this.onerror=null;this.src='${SILHOUETTE_PATH}${artifact.silhouette}.svg';this.style='';">
        <div class="card-name">
          <span class="rarity-halo" style="background:${rarityColor}"></span>${artifact.name}
        </div>
      `;
      if (artifact.treasure) {
        card.title = artifact.name + ' · 禁止出境文物';
      }
      cardsEl.appendChild(card);
    });

    // "More" placeholder
    if (dynasty.collected > dynasty.artifacts.length) {
      const more = document.createElement('div');
      more.style.cssText = 'flex-shrink:0;padding:0 8px;font-size:11px;color:var(--text-muted);white-space:nowrap;';
      more.innerHTML = `<a href="catalog.html?era=${dynasty.name}" style="color:var(--text-bronze);text-decoration:none;">+更多 ${dynasty.name}代器物 →</a>`;
      cardsEl.appendChild(more);
    }
  } else {
    cardsEl.innerHTML = `<div style="font-size:12px;color:var(--text-muted);padding:0 8px;">
      ${dynasty.name}代器物待探索 · <a href="catalog.html?era=${dynasty.name}" style="color:var(--text-bronze)">浏览图鉴</a>
    </div>`;
  }
}

// ============================================================
//  ERA-FOCUS HANDLER (the critical 3-way linkage)
// ============================================================

function handleEraFocus(payload) {
  if (!_linkageEnabled) return;

  const { dynasty: dynastyName, geo_era, dominant_patterns } = payload;

  // Find dynasty data
  const dynasty = DYNASTIES.find(d => d.name === dynastyName);
  if (!dynasty) return;

  // ① Map: swap era overlay
  const geoKey = geo_era || dynasty.geo_era;
  if (_currentGeoEra !== geoKey) {
    _currentGeoEra = geoKey;
    showMapEra(geoKey);
    const badge = document.getElementById('map-era-badge');
    badge.textContent = dynastyName;
    badge.style.color = dynasty.color || 'var(--text-gold)';
    badge.style.borderColor = dynasty.color ? dynasty.color + '88' : 'var(--border-bright)';
  }

  // ② Pattern strip: highlight dominant patterns
  const patterns = dominant_patterns || dynasty.dominant_patterns || [];
  const dominantSlugs = ERA_DOMINANT_PATTERNS[dynastyName] || [];
  updatePatternStrip(dynastyName, [...dominantSlugs, ...patterns]);

  // ③ Bottom panel: update era badge + artifacts
  updateBottomPanel(dynasty);
}

// Listen for era-focus from any source (including pillar's own emit)
bus.on('era-focus', (payload) => {
  handleEraFocus(payload);
});

// ============================================================
//  MAP ERA-FOCUS LINKAGE (map can also emit back)
// ============================================================

function onSiteClick(site) {
  // Find which dynasty this site belongs to
  const dynastyMatch = DYNASTIES.find(d => d.name === site.dynasty);
  if (dynastyMatch) {
    bus.emit('era-focus', {
      dynasty: dynastyMatch.name,
      geo_era: dynastyMatch.geo_era,
      dominant_patterns: dynastyMatch.dominant_patterns,
      triggered_by: 'geo-map'
    });
    // Also update pillar
    updatePillarHighlight(dynastyMatch.name);
  }
}

// ============================================================
//  INIT
// ============================================================

document.addEventListener('DOMContentLoaded', () => {
  // Build components
  buildTimePillar();
  buildMap();
  buildPatternStrip();
  // Upgrade to real GeoJSON (B1 phase data) once available; rebuilds map.
  loadRealGeoData();

  // Auto-focus 商 dynasty on load after short delay (wow demo effect)
  setTimeout(() => {
    const shang = DYNASTIES.find(d => d.name === '商');
    if (shang) {
      bus.emit('era-focus', {
        dynasty: '商',
        geo_era: 'shang',
        dominant_patterns: shang.dominant_patterns,
        triggered_by: 'auto-init'
      });
      updatePillarHighlight('商');
      _lockedEra = '商';
      // Highlight the 商 band visually
      setTimeout(() => {
        updatePillarHighlight('商');
      }, 100);
    }
  }, 400);
});

// Resize handler for map
window.addEventListener('resize', () => {
  // Rebuild map on significant resize
  const mapSvg = document.getElementById('map-svg');
  if (mapSvg) {
    mapSvg.innerHTML = '';
    buildMap();
    if (_currentGeoEra) showMapEra(_currentGeoEra);
  }
});
</script>
