const LINKS = [
  {source:'fuhao', target:'wuding', label:'夫妻'},
  {source:'wuding', target:'zugeng', label:'父子'},
  {source:'wuding', target:'zujia', label:'父子'},
  {source:'zugeng', target:'zujia', label:'兄弟'},
  {source:'zhouwuwang', target:'zhouchengwang', label:'父子'},
  {source:'zhouxuanwang', target:'maogong', label:'君臣'},
];

let activeCasterId = null;

function buildGraph() {
  const el = document.getElementById('force-graph');
  const W = el.clientWidth || 600;
  const H = 420;

  const svg = d3.select('#force-graph')
    .attr('width', W).attr('height', H);
  svg.selectAll('*').remove();

  // Background
  svg.append('rect').attr('width', W).attr('height', H).attr('fill', '#f8f4ec');

  const sim = d3.forceSimulation(CASTERS)
    .force('link', d3.forceLink(LINKS.map(l => ({
      source: CASTERS.findIndex(c => c.id === l.source),
      target: CASTERS.findIndex(c => c.id === l.target),
      label: l.label
    }))).distance(80).strength(0.3))
    .force('charge', d3.forceManyBody().strength(-200))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collision', d3.forceCollide(30));

  const indexedLinks = LINKS.map(l => ({
    source: CASTERS.findIndex(c => c.id === l.source),
    target: CASTERS.findIndex(c => c.id === l.target),
    label: l.label
  }));

  const link = svg.append('g').selectAll('line')
    .data(indexedLinks).enter().append('line')
    .attr('class', 'link').attr('stroke-width', 1.5);

  const linkLabel = svg.append('g').selectAll('text')
    .data(indexedLinks).enter().append('text')
    .attr('text-anchor', 'middle').attr('font-size', 9).attr('fill', '#aaa')
    .text(d => d.label);

  const node = svg.append('g').selectAll('.node')
    .data(CASTERS).enter().append('g')
    .attr('class', 'node').attr('id', d => `node-${d.id}`)
    .call(d3.drag()
      .on('start', (event, d) => { if (!event.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on('end', (event, d) => { if (!event.active) sim.alphaTarget(0); d.fx = null; d.fy = null; })
    );

  node.append('circle')
    .attr('r', d => 6 + d.size)
    .attr('fill', d => d.collected_count > 0 ? d.color : '#ccc')
    .attr('opacity', d => d.collected_count > 0 ? 0.9 : 0.5)
    .attr('stroke', d => d.collected_count > 0 ? 'rgba(212,168,87,.5)' : 'none')
    .attr('stroke-width', 2);

  node.append('text').attr('class', 'node-label')
    .attr('text-anchor', 'middle').attr('dy', '3')
    .attr('fill', 'white').attr('font-size', 9)
    .text(d => d.name.slice(0, 2));

  node.append('text')
    .attr('x', 0).attr('dy', d => 6 + d.size + 12)
    .attr('text-anchor', 'middle').attr('font-size', 10).attr('fill', '#555')
    .text(d => d.name);

  node.on('click', (event, d) => showCasterDetail(d.id));

  sim.on('tick', () => {
    link.attr('x1', d => CASTERS[d.source].x).attr('y1', d => CASTERS[d.source].y)
        .attr('x2', d => CASTERS[d.target].x).attr('y2', d => CASTERS[d.target].y);
    linkLabel.attr('x', d => (CASTERS[d.source].x + CASTERS[d.target].x) / 2)
             .attr('y', d => (CASTERS[d.source].y + CASTERS[d.target].y) / 2 - 4);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

function buildCasterList() {
  const list = document.getElementById('caster-list');
  CASTERS.forEach(c => {
    const el = document.createElement('div');
    el.className = 'caster-card';
    el.id = `card-${c.id}`;
    el.innerHTML = `
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
        <div style="width:10px; height:10px; border-radius:50%; background:${c.collected_count > 0 ? c.color : '#ccc'};"></div>
        <div style="font-size:13px; font-weight:600;">${c.name}</div>
        ${c.collected_count > 0 ? `<span style="font-size:9px; background:#fdf0e0; color:var(--accent-bronze); padding:1px 5px; border-radius:10px;">${c.collected_count}件</span>` : ''}
      </div>
      <div style="font-size:11px; color:var(--text-muted);">${c.era}</div>
    `;
    el.addEventListener('click', () => showCasterDetail(c.id));
    list.appendChild(el);
  });
}

function showCasterDetail(casterId) {
  activeCasterId = casterId;
  const c = CASTERS.find(x => x.id === casterId);
  if (!c) return;

  document.querySelectorAll('.caster-card').forEach(el => el.classList.remove('active'));
  document.getElementById(`card-${casterId}`)?.classList.add('active');
  d3.selectAll('.node').classed('active', d => d.id === casterId);

  const detail = document.getElementById('caster-detail');
  detail.innerHTML = `
    <div style="background:linear-gradient(135deg,#1a1510,#2a2018); color:white; border-radius:12px; padding:20px; margin-bottom:16px;">
      <div style="font-size:11px; color:rgba(164,115,44,.7); margin-bottom:6px; letter-spacing:.1em;">${c.dynasty}代铸主</div>
      <div style="font-size:24px; font-weight:700; margin-bottom:4px;">${c.name}</div>
      <div style="font-size:14px; color:rgba(255,255,255,.7); margin-bottom:4px;">${c.name_en}</div>
      <div style="font-size:12px; color:rgba(164,115,44,.7);">${c.era}</div>
      <div style="font-size:12px; color:rgba(255,255,255,.6); margin-top:8px; line-height:1.6;">${c.role}</div>
    </div>
    <div class="biography-section" style="background:white; border:1px solid var(--border-light); border-radius:12px; padding:16px;">
      <h3>▲ 历史记载</h3>
      <div style="font-size:13px; color:var(--text-ink); line-height:1.7; margin-bottom:12px;">${c.bio_record}</div>
      <h3>▲ 考古发现</h3>
      <div style="font-size:13px; color:var(--text-ink); line-height:1.7; margin-bottom:12px;">${c.bio_arch}</div>
      <h3>▲ 传世器物 (您已收藏 ${c.collected_count}/${c.artifacts.length})</h3>
      <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:12px;">
        ${c.artifacts.map(a => `
          <div style="display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; background:${a.collected?'#fdf8f0':'#f5f5f5'}; cursor:pointer;" onclick="location.href='artifact.html?id=${a.name}'">
            <div style="width:8px; height:8px; border-radius:50%; background:${a.collected?'var(--accent-bronze)':'#ccc'};"></div>
            <span style="font-size:12px; flex:1;">${a.name}</span>
            <span style="font-size:10px; color:${a.rarity==='国宝'?'var(--accent-red)':'var(--text-muted)'};">${a.rarity}</span>
            ${a.collected ? '<span style="font-size:10px; color:var(--accent-bronze);">✓ 已收</span>' : ''}
          </div>
        `).join('')}
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <a href="inscription-reader.html" style="color:var(--accent-bronze); font-size:12px; text-decoration:none;">→ 查看相关铭文</a>
        <a href="time-pillar.html" style="color:var(--accent-bronze); font-size:12px; text-decoration:none;">→ 时代柱定位</a>
      </div>
    </div>
  `;

  // Emit caster era focus
  if (window.CrossDimWiring) {
    window.CrossDimWiring.emitEra(c.dynasty, 'caster-profile.click');
  }
}

// Listen for caster-focus events
document.addEventListener('caster-focus', function(e) {
  const { caster_ref } = e.detail || {};
  if (!caster_ref) return;
  const c = CASTERS.find(x => x.name.includes(caster_ref) || caster_ref.includes(x.name.slice(0,2)));
  if (c) showCasterDetail(c.id);
});

document.addEventListener('DOMContentLoaded', () => {
  buildGraph();
  buildCasterList();
  // Show first caster
  showCasterDetail('fuhao');
});
</script>
