<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地理系统 — MuseumCollect v3</title>
<script src="../../assets/vendor/d3.v7.min.js"></script>
<link rel="stylesheet" href="css/converged.css">
<style>
#map-container { background: #e7eef0; border-radius: 12px; border: 1px solid var(--border-light); overflow: hidden; position: relative; }
.site-circle { cursor: pointer; transition: all .3s; }
.site-circle:hover { filter: brightness(1.4); }
.site-label { font-size: 10px; pointer-events: none; }
.detail-panel { background: white; border: 1px solid var(--border-light); border-radius: 12px; padding: 20px; height: 100%; overflow-y: auto; }
.era-slider { -webkit-appearance: none; width: 100%; height: 6px; background: var(--border-light); border-radius: 3px; outline: none; cursor: pointer; }
.era-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-bronze); cursor: pointer; }
.view-tab { padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: all .2s; border: 1px solid var(--border-medium); background: white; color: var(--text-muted); }
.view-tab.active { background: var(--accent-bronze); color: white; border-color: var(--accent-bronze); }
.overseas-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-bottom: 1px solid var(--border-light); cursor: pointer; transition: all .2s; }
.overseas-item:hover { background: var(--bg-cream); }
</style>
</head>
<body data-page="geo-system">

<nav id="top-nav-placeholder" class="top-nav"></nav>
<script src="js/nav.js"></script>

<div class="page-container" style="padding:24px;">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
    <div>
      <h1 class="page-title" style="margin-bottom:4px;">地理系统</h1>
      <p class="page-subtitle">出土遗址 · 馆藏分布 · 海外流散 · 时代滑块联动</p>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="view-tab active" id="view-excavation" onclick="setView('excavation')">出土遗址</button>
      <button class="view-tab" id="view-museum" onclick="setView('museum')">馆藏分布</button>
      <button class="view-tab" id="view-overseas" onclick="setView('overseas')">海外流散</button>
    </div>
  </div>

  <div class="with-sidebar">
    <!-- Map -->
    <div>
      <!-- Era slider -->
      <div id="era-controls" style="background:white; border:1px solid var(--border-light); border-radius:8px; padding:12px 16px; margin-bottom:12px; display:flex; align-items:center; gap:12px;">
        <span style="font-size:12px; color:var(--text-muted); white-space:nowrap;">时代：</span>
        <input type="range" class="era-slider" id="era-slider" min="0" max="5" value="1" oninput="onEraSlider(this.value)">
        <span id="era-label" style="font-size:13px; font-weight:600; color:var(--accent-bronze); white-space:nowrap; min-width:40px;">商</span>
      </div>
      <div id="map-container" style="height:520px;">
        <svg id="map-svg" width="100%" height="100%"></svg>
        <div style="position:absolute; left:10px; bottom:10px; font-size:11px; color:#6a7a72; background:rgba(255,255,255,0.7); padding:3px 8px; border-radius:6px; pointer-events:none;">⛰ 山脉 · 〜 河流 · 滚轮缩放 · 拖动平移</div>
        <button id="map-reset" onclick="_mapZoomReset && _mapZoomReset()" style="position:absolute; right:10px; bottom:10px; font-size:11px; color:var(--text-muted); background:white; border:1px solid var(--border-light); border-radius:6px; padding:4px 10px; cursor:pointer;">⤢ 重置视图</button>

        <div style="text-align:center; padding:40px 0; color:var(--text-muted);">

          <div style="font-size:13px;">点击遗址或博物馆<br>查看详情</div>

      </div>
    </div>

const OVERSEAS_ITEMS = [
  { museum: '大都会博物馆 (MET)', city: '纽约', count: 18, note: '清末至民国间私人藏家收购，部分经1930-40年代古董商流出', highlight: '铭文方鼎、商代饕餮卣' },
  { museum: '大英博物馆', city: '伦敦', count: 14, note: '维多利亚时代外交官、传教士收集，部分可能涉及非正常流出', highlight: '方彝、铜鬲' },
  { museum: '弗利尔艺术馆', city: '华盛顿', count: 11, note: '弗利尔个人在华收购，20世纪初', highlight: '觚、爵等商代酒器系列' },
  { museum: '赛努奇博物馆', city: '巴黎', count: 8, note: '法国收藏家19-20世纪收购', highlight: '周代铭文簋' },
  { museum: '京都泉屋博物馆', city: '京都', count: 6, note: '日本住友家族近代收购', highlight: '商代饕餮方彝' },
];

let currentView = 'excavation';
const ERA_SEQUENCE = ['夏','商','西周','春秋','战国','秦'];
const ERA_COLORS = window.MuseumConstants.ERA_COLORS;
let currentEra = '商';

function setView(view) {
  currentView = view;
  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`view-${view}`).classList.add('active');
  document.getElementById('era-controls').style.display = view === 'overseas' ? 'none' : 'flex';
  document.getElementById('overseas-panel').style.display = view === 'overseas' ? 'block' : 'none';
  renderMap();
  if (view === 'overseas') renderOverseas();
}

function onEraSlider(val) {
  const era = ERA_SEQUENCE[parseInt(val)];
  currentEra = era;
  document.getElementById('era-label').textContent = era;
  document.getElementById('era-label').style.color = ERA_COLORS[era] || 'var(--accent-bronze)';
  renderMap();
  // Emit era-focus event
  document.dispatchEvent(new CustomEvent('era-focus', {
    detail: { dynasty: era, triggered_by: 'geo-system.slider' }
  }));
}

let _realGeo = {}; // { terrain, shang, xizhou, chunqiu, zhanguo, excavation, museums }
let _mapProjection = null;
let _mapGeoPath = null;
let _mapZoomReset = null;

async function loadRealGeoData() {
  const eras = ['shang', 'xizhou', 'chunqiu', 'zhanguo'];
  try {
    const [terrain, rivers, physio, excavation, museums, ...states] = await Promise.all([
      fetch('../../assets/geo/china-provinces-highres.geojson').then(r => r.json()),
      fetch('../../assets/geo/rivers-major.geojson').then(r => r.json()).catch(() => null),
      fetch('../../assets/geo/physio-features.geojson').then(r => r.json()).catch(() => null),
      fetch('../../assets/geo/excavation-sites.geojson').then(r => r.json()),
      fetch('../../assets/geo/museums.geojson').then(r => r.json()),
      ...eras.map(e => fetch(`../../assets/geo/ancient-states-${e}.geojson`).then(r => r.json()))
    ]);
    _realGeo.terrain = terrain;
    _realGeo.rivers = rivers;
    _realGeo.physio = physio;
    _realGeo.excavation = excavation;
    _realGeo.museums = museums;
    eras.forEach((e, i) => { _realGeo[e] = states[i]; });
    renderMap();
  } catch (e) {
    console.warn('[geo-system] real GeoJSON fetch failed, keeping inline fallback:', e.message);
  }
}

// Era → GeoJSON key mapping
const ERA_TO_GEO_KEY = { '商': 'shang', '西周': 'xizhou', '春秋': 'chunqiu', '战国': 'zhanguo' };

function renderMap() {
  const svg = d3.select('#map-svg');
  const container = document.getElementById('map-container');
  const W = container.offsetWidth;
  const H = container.offsetHeight;

  svg.attr('width', W).attr('height', H);
  svg.selectAll('*').remove();

  const padX = 40, padY = 30;
  if (_realGeo.terrain) {
    // Frame the BRONZE-AGE HEARTLAND (sites + basins + ranges), not all of modern
    // China — otherwise Xinjiang/Tibet waste the canvas and the relevant terrain
    // (秦岭 between 关中 & 蜀, 太行/吕梁 around 晋) shrinks to illegibility.
    // Build the projection by fitting the WHOLE-China FeatureCollection (this is the
    // proven path — fitExtent on a small/point object degenerates with conic+rotate).
    // We then focus the bronze heartland via an initial d3.zoom transform (see below).
    _mapProjection = d3.geoConicEqualArea()
      .parallels([25, 47]).rotate([-105, 0])
      .fitExtent([[padX, padY], [W - padX, H - padY]], _realGeo.terrain);
    _mapGeoPath = d3.geoPath(_mapProjection);
  } else { _mapProjection = null; _mapGeoPath = null; }

  // Static background (does NOT pan/zoom)
  svg.append('rect').attr('width', W).attr('height', H).attr('fill', '#e9eef0');

  // Everything geographic lives in this layer so d3.zoom can pan/zoom it.
  const layer = svg.append('g').attr('class', 'zoom-layer');
  const NS = 'non-scaling-stroke';

  if (!_mapGeoPath) {
    layer.append('text').attr('x', W/2).attr('y', H/2).attr('text-anchor','middle')
      .attr('fill','#999').text('地图数据加载中…');
  } else {
    const path = _mapGeoPath, proj = _mapProjection;

    // 1. Land backdrop — ONLY the provinces overlapping the bronze heartland, as a
    //    faint silhouette for orientation (coast, river mouths). Far-west provinces
    //    (Tibet/Xinjiang/Inner Mongolia) are dropped so they don't dominate the frame.
    //    This is NOT a political map — internal borders are nearly invisible.
    const inHeartland = f => { const c = d3.geoCentroid(f); return c[0] >= 100 && c[0] <= 123 && c[1] >= 22 && c[1] <= 43; };
    layer.append('g').selectAll('path').data(_realGeo.terrain.features.filter(inHeartland)).enter().append('path')
      .attr('d', path).attr('fill', '#eef1e8').attr('stroke', '#e2e6da')
      .attr('stroke-width', 0.4).style('vector-effect', NS);

    // 2. Basins / plains — the habitable cores where civilizations clustered.
    if (_realGeo.physio) {
      const basins = _realGeo.physio.features.filter(f => f.properties.kind === 'basin');
      layer.append('g').selectAll('path').data(basins).enter().append('path')
        .attr('d', path).attr('fill', '#e3ead0').attr('fill-opacity', 0.75)
        .attr('stroke', '#cfd5b2').attr('stroke-width', 0.5).style('vector-effect', NS);
      basins.forEach(f => { const p = proj(d3.geoCentroid(f)); if (p) _label(layer, p, f.properties.name, {color:'#7e8556', size:9, italic:true}); });
    }

    // 3. Mountain ranges — the BARRIERS that explain why sites sit where they do
    //    (秦岭+大巴山 isolate 古蜀; 太行+吕梁 frame the 汾河 valley of 晋, etc.).
    if (_realGeo.physio) {
      const ranges = _realGeo.physio.features.filter(f => f.properties.kind === 'range');
      const rg = layer.append('g');
      ranges.forEach(f => {
        rg.append('path').datum(f).attr('d', path).attr('fill','none').attr('stroke','#a98e60')
          .attr('stroke-width',6).attr('stroke-linecap','round').attr('stroke-linejoin','round')
          .attr('opacity',0.5).style('vector-effect', NS);
        rg.append('path').datum(f).attr('d', path).attr('fill','none').attr('stroke','#6f5b34')
          .attr('stroke-width',1.2).attr('stroke-dasharray','0.5,5').attr('stroke-linecap','round')
          .attr('opacity',0.7).style('vector-effect', NS);
        const cs = f.geometry.coordinates; const mid = cs[Math.floor(cs.length/2)];
        const p = proj(mid); if (p) _label(layer, p, '⛰ '+f.properties.name, {color:'#6f5b34', size:9, weight:600});
      });
      _realGeo.physio.features.filter(f=>f.properties.kind==='peak').forEach(f=>{
        const p = proj(f.geometry.coordinates); if (p) _label(layer, [p[0],p[1]+3], '▲ '+f.properties.name, {color:'#6f5b34', size:8});
      });
    }

    // 4. Rivers — the arteries (黄河/长江 + 渭/汾/洛伊/汉) along which settlement strung.
    if (_realGeo.rivers) {
      const rv = layer.append('g');
      _realGeo.rivers.features.forEach(f => {
        const major = f.properties.tier === 'major';
        rv.append('path').datum(f).attr('d', path).attr('fill','none').attr('stroke','#5b91ad')
          .attr('stroke-width', major?2.2:1.3).attr('stroke-linejoin','round').attr('stroke-linecap','round')
          .attr('opacity', major?0.85:0.65).style('vector-effect', NS);
        const cs = f.geometry.coordinates; const p = proj(cs[Math.floor(cs.length*0.55)]);
        if (p) _label(layer, p, f.properties.name, {color:'#3f7593', size: major?9:8, italic:true});
      });
    }

    // 5. Era overlay (ancient states / 古国疆域) for the selected era.
    const eraKey = ERA_TO_GEO_KEY[currentEra];
    if (eraKey && _realGeo[eraKey]) {
      _realGeo[eraKey].features.forEach(f => {
        const pp = f.properties || {};
        const color = pp.color || ERA_COLORS[currentEra] || '#888';
        const opacity = pp.opacity != null ? pp.opacity : 0.25;
        layer.append('path').datum(f).attr('d', path).attr('fill', color).attr('fill-opacity', opacity*0.5)
          .attr('stroke', color).attr('stroke-opacity', 0.5).attr('stroke-width', 1)
          .attr('stroke-dasharray', '4,3').style('vector-effect', NS);
        const p = proj(d3.geoCentroid(f)); if (p) _label(layer, p, pp.name||'', {color: color, size:9});
      });
    }

    // 6. Sites (excavation / museums) — projected from real lon/lat.
    _renderSites(layer, proj, W, H);
  }

  // North indicator (static, outside the zoom layer)
  svg.append('text').attr('x', W - 28).attr('y', 26).attr('font-size', 15).attr('fill', '#8a9088').text('N↑');

  // Compute an initial transform that FOCUSES the bronze heartland (lon 100-123,
  // lat 22-42) within the whole-China projection — this is how we "zoom in" to the
  // relevant region without the degenerate small-extent fit.
  let focusT = d3.zoomIdentity;
  if (_mapProjection) {
    const c1 = _mapProjection([100, 42]), c2 = _mapProjection([123, 22]);
    if (c1 && c2) {
      const bx0 = Math.min(c1[0],c2[0]), bx1 = Math.max(c1[0],c2[0]);
      const by0 = Math.min(c1[1],c2[1]), by1 = Math.max(c1[1],c2[1]);
      const bw = Math.max(1, bx1-bx0), bh = Math.max(1, by1-by0);
      const k = Math.max(1, Math.min(8, Math.min((W-2*padX)/bw, (H-2*padY)/bh) * 0.95));
      const tx = W/2 - k*(bx0+bx1)/2, ty = H/2 - k*(by0+by1)/2;
      focusT = d3.zoomIdentity.translate(tx, ty).scale(k);
    }
  }

  // Pan / zoom
  const maxK = Math.max(14, (focusT.k || 1) + 6);
  const zoom = d3.zoom().scaleExtent([1, maxK])
    .translateExtent([[0,0],[W,H]]).extent([[0,0],[W,H]])
    .on('zoom', (ev) => { layer.attr('transform', ev.transform); _applyZoomScale(ev.transform.k); });
  svg.call(zoom).style('cursor', 'grab');
  svg.on('mousedown.cursor', () => svg.style('cursor','grabbing'))
     .on('mouseup.cursor', () => svg.style('cursor','grab'));
  _mapZoomReset = () => svg.transition().duration(450).call(zoom.transform, focusT);
  // apply initial focus
  svg.call(zoom.transform, focusT);
}

// Counter-scale labels & markers so they stay a constant screen size while zooming.
function _applyZoomScale(k) {
  const svg = d3.select('#map-svg');
  svg.selectAll('text.zlabel').attr('font-size', function(){ return (+this.getAttribute('data-size')||10)/k; });
  svg.selectAll('.zdot').attr('r', function(){ return (+this.getAttribute('data-r')||6)/k; });
  svg.selectAll('.zglow').attr('r', function(){ return (+this.getAttribute('data-r')||10)/k; });
  svg.selectAll('text.zsite').attr('font-size', function(){ return (+this.getAttribute('data-size')||11)/k; })
     .attr('x', function(){ return (+this.getAttribute('data-x')) + ((+this.getAttribute('data-r'))+4)/k; });
}

function _label(layer, p, text, opt) {
  opt = opt || {};
  layer.append('text').attr('class','zlabel').attr('data-size', opt.size||10)
    .attr('x', p[0]).attr('y', p[1]).attr('text-anchor','middle')
    .attr('font-size', opt.size||10).attr('fill', opt.color||'#555')
    .attr('font-weight', opt.weight||400).attr('font-style', opt.italic?'italic':'normal')
    .attr('font-family','Noto Serif SC, serif').style('pointer-events','none')
    .style('paint-order','stroke').style('stroke','rgba(255,255,255,0.75)').style('stroke-width','2px')
    .text(text);
}

function _renderSites(layer, proj, W, H) {
  const useRealSites = !!(proj && (
    (currentView === 'museum' && _realGeo.museums) ||
    (currentView !== 'museum' && _realGeo.excavation)));
  let sites;
  if (useRealSites) {
    const fc = currentView === 'museum' ? _realGeo.museums : _realGeo.excavation;
    sites = fc.features.map(f => { const p = f.properties || {}; const [lon, lat] = f.geometry.coordinates;
      return { name:p.name, dynasty:p.dynasty||'', desc:p.brief||p.description||'',
        count:p.artifact_count||p.bronze_count_approx||p.user_collected||1, artifacts:p.key_artifacts||[],
        lit:p.user_collected!==undefined?p.user_collected>0:true, _lon:lon, _lat:lat }; });
  } else { sites = currentView === 'museum' ? MUSEUM_SITES : EXCAVATION_SITES; }

  sites.forEach(site => {
    let cx, cy;
    if (useRealSites && proj) { const pr = proj([site._lon, site._lat]); if (!pr || isNaN(pr[0])) return; [cx, cy] = pr; }
    else { cx = site.x/100*W; cy = site.y/100*H; }
    const isLit = currentView === 'museum' ? true : (site.lit && (site.dynasty === currentEra || currentView === 'excavation'));
    const color = ERA_COLORS[site.dynasty] || ERA_COLORS[currentEra] || '#888';
    const radMult = useRealSites ? 1.0 : 2.5;
    const r = Math.max(5, Math.min(20, Math.sqrt(site.count) * radMult));
    const g = layer.append('g').attr('class', 'site-circle').style('cursor','pointer');
    if (isLit && site.count > 0)
      g.append('circle').attr('class','zglow').attr('data-r', r+4).attr('cx',cx).attr('cy',cy).attr('r',r+4).attr('fill',color).attr('opacity',0.15);
    g.append('circle').attr('class','zdot').attr('data-r', r).attr('cx',cx).attr('cy',cy).attr('r',r)
      .attr('fill', isLit?color:'#bbb').attr('opacity', isLit?0.9:0.4).attr('stroke','white').attr('stroke-width',1).style('vector-effect','non-scaling-stroke');
    g.append('text').attr('class','zsite').attr('data-x',cx).attr('data-r',r).attr('data-size',11)
      .attr('x', cx+r+4).attr('y', cy+3).attr('fill', isLit?'#2a2620':'#999').attr('font-size',11)
      .attr('font-weight', isLit?600:400).attr('font-family','Noto Serif SC, serif').style('pointer-events','none')
      .style('paint-order','stroke').style('stroke','rgba(255,255,255,0.85)').style('stroke-width','2.5px').text(site.name);
    g.on('click', () => showSiteDetail(site));
  });
}

function showSiteDetail(site) {
  const panel = document.getElementById('detail-panel');
  const isExcav = currentView === 'excavation';
  panel.innerHTML = `
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
      <div style="width:12px; height:12px; border-radius:50%; background:${ERA_COLORS[site.dynasty]||'#888'};"></div>
      <div style="font-size:18px; font-weight:700;">${site.name}</div>
      ${site.dynasty ? `<div style="font-size:12px; color:var(--text-muted);">${site.dynasty}代</div>` : ''}
    </div>
    <div style="font-size:13px; color:var(--text-ink); line-height:1.7; margin-bottom:12px;">${site.desc}</div>
    <div style="margin-bottom:12px;">
      <div class="field-label">收藏器物</div>
      <div style="font-size:20px; font-weight:700; color:var(--accent-bronze);">${site.count} 件</div>
    </div>
    ${(site.artifacts||[]).length > 0 ? `
    <div>
      <div class="field-label" style="margin-bottom:6px;">代表器物：</div>
      ${site.artifacts.map(a => `
        <div style="padding:6px 8px; background:var(--bg-cream); border-radius:6px; font-size:12px; cursor:pointer; margin-bottom:4px;"
          onclick="location.href='catalog.html?search=${encodeURIComponent(a)}'">🏺 ${a}</div>
      `).join('')}
    </div>
    ` : ''}
    <div style="margin-top:16px;">
      <a href="catalog.html?geo=${encodeURIComponent(site.name)}" style="color:var(--accent-bronze); font-size:12px; text-decoration:none;">→ 查看全部来自${site.name}的器物</a>
    </div>
  `;
  // Emit site-focus
  document.dispatchEvent(new CustomEvent('region-focus', { detail: { site: site.name, dynasty: site.dynasty, triggered_by: 'geo-system.click' } }));
}

function renderOverseas() {
  const list = document.getElementById('overseas-list');
  list.innerHTML = OVERSEAS_ITEMS.map(item => `
    <div class="overseas-item">
      <div style="font-size:24px;">🌐</div>
      <div style="flex:1;">
        <div style="font-size:14px; font-weight:600; margin-bottom:4px;">${item.museum}</div>
        <div style="font-size:12px; color:var(--text-muted); margin-bottom:4px;">${item.city} · ${item.count} 件已知</div>
        <div style="font-size:11px; color:var(--text-muted); line-height:1.5;">${item.note}</div>
        <div style="font-size:11px; color:var(--accent-bronze); margin-top:4px;">${item.highlight}</div>
      </div>
    </div>
  `).join('');
}

// Listen for era-focus from other components
document.addEventListener('era-focus', function(e) {
  const { dynasty } = e.detail || {};
  if (!dynasty || !window.CrossDimWiring || !window.CrossDimWiring.isEnabled()) return;
  currentEra = dynasty;
  const idx = ERA_SEQUENCE.indexOf(dynasty);
  if (idx >= 0) {
    document.getElementById('era-slider').value = idx;
    document.getElementById('era-label').textContent = dynasty;
    document.getElementById('era-label').style.color = ERA_COLORS[dynasty] || 'var(--accent-bronze)';
  }
  renderMap();
});

document.addEventListener('DOMContentLoaded', () => {
  renderMap();
  // Upgrade to real GeoJSON (B1 phase data) once available; re-renders map.
  loadRealGeoData();
  window.addEventListener('resize', renderMap);
});
</script>
</body>
</html>
