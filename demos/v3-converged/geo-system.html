<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地理系统 — MuseumCollect v3</title>
<script src="../../assets/vendor/d3.v7.min.js"></script>
<link rel="stylesheet" href="css/converged.css">
<style>
#map-container { background: #f4ebd9; border-radius: 12px; border: 1px solid var(--border-light); overflow: hidden; position: relative; }
.site-circle { cursor: pointer; transition: all .3s; }
.site-circle:hover { filter: brightness(1.4); }
.site-label { font-size: 10px; pointer-events: none; }
.detail-panel { background: white; border: 1px solid var(--border-light); border-radius: 12px; padding: 20px; height: 100%; overflow-y: auto; }
.era-slider { -webkit-appearance: none; width: 100%; height: 6px; background: var(--border-light); border-radius: 3px; outline: none; cursor: pointer; }
.era-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-bronze); cursor: pointer; }
.view-tab { padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: all .2s; border: 1px solid var(--border-medium); background: white; color: var(--text-muted); }
.view-tab.active { background: var(--accent-bronze); color: white; border-color: var(--accent-bronze); }
.overseas-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-bottom: 1px solid var(--border-light); cursor: pointer; transition: all .2s; }
.overseas-item:hover { background: var(--bg-cream); }
</style>
</head>
<body data-page="geo-system">

<nav id="top-nav-placeholder" class="top-nav"></nav>
<script src="js/nav.js"></script>

<div class="page-container" style="padding:24px;">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
    <div>
      <h1 class="page-title" style="margin-bottom:4px;">地理系统</h1>
      <p class="page-subtitle">出土遗址 · 馆藏分布 · 海外流散 · 时代滑块联动</p>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="view-tab active" id="view-excavation" onclick="setView('excavation')">出土遗址</button>
      <button class="view-tab" id="view-museum" onclick="setView('museum')">馆藏分布</button>
      <button class="view-tab" id="view-overseas" onclick="setView('overseas')">海外流散</button>
    </div>
  </div>

  <div style="display:grid; grid-template-columns:1fr 320px; gap:20px;">
    <!-- Map -->
    <div>
      <!-- Era slider -->
      <div id="era-controls" style="background:white; border:1px solid var(--border-light); border-radius:8px; padding:12px 16px; margin-bottom:12px; display:flex; align-items:center; gap:12px;">
        <span style="font-size:12px; color:var(--text-muted); white-space:nowrap;">时代：</span>
        <input type="range" class="era-slider" id="era-slider" min="0" max="5" value="1" oninput="onEraSlider(this.value)">
        <span id="era-label" style="font-size:13px; font-weight:600; color:var(--accent-bronze); white-space:nowrap; min-width:40px;">商</span>
      </div>
      <div id="map-container" style="height:520px;">
        <svg id="map-svg" width="100%" height="100%"></svg>
      </div>
    </div>

    <!-- Detail panel -->
    <div>
      <div class="detail-panel" id="detail-panel">
        <div style="text-align:center; padding:40px 0; color:var(--text-muted);">
          <div style="font-size:36px; margin-bottom:12px;">🗺</div>
          <div style="font-size:13px;">点击遗址或博物馆<br>查看详情</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Overseas panel (hidden by default) -->
  <div id="overseas-panel" style="display:none; margin-top:20px;">
    <div style="background:var(--bg-cream); border:1px solid var(--border-light); border-radius:12px; padding:20px;">
      <div style="display:flex; align-items:baseline; gap:12px; margin-bottom:16px;">
        <h2 style="font-size:18px; font-weight:700;">海外流散</h2>
        <span style="font-size:13px; color:var(--text-muted);">55 件已知流散海外</span>
        <span style="font-size:11px; color:rgba(120,100,80,.7); font-style:italic; margin-left:auto;">本应在家</span>
      </div>
      <div id="overseas-list"></div>
    </div>
  </div>
</div>

<script src="js/constants.js"></script>
<script src="js/state.js"></script>
<script src="js/cross-dim-wiring.js"></script>
<script>

const MUSEUM_SITES = [
  { name: '国家博物馆', x: 58, y: 36, count: 35, desc: '北京。后母戊鼎、四羊方尊等国宝的永久家园。' },

  { name: '台北故宫', x: 64, y: 49, count: 25, desc: '台湾台北。毛公鼎、散氏盘等西周顶级国宝。' },
  { name: '河南博物院', x: 55, y: 40, count: 18, desc: '郑州。妇好鸮尊、莲鹤方壶等出土地就近收藏。' },

  { name: '宝鸡青铜博物院', x: 46, y: 40, count: 10, desc: '宝鸡。何尊永久家园。' },
  { name: '三星堆博物馆', x: 43, y: 52, count: 8, desc: '广汉。古蜀文明全套珍品。' },

const OVERSEAS_ITEMS = [
  { museum: '大都会博物馆 (MET)', city: '纽约', count: 18, note: '清末至民国间私人藏家收购，部分经1930-40年代古董商流出', highlight: '铭文方鼎、商代饕餮卣' },
  { museum: '大英博物馆', city: '伦敦', count: 14, note: '维多利亚时代外交官、传教士收集，部分可能涉及非正常流出', highlight: '方彝、铜鬲' },
  { museum: '弗利尔艺术馆', city: '华盛顿', count: 11, note: '弗利尔个人在华收购，20世纪初', highlight: '觚、爵等商代酒器系列' },
  { museum: '赛努奇博物馆', city: '巴黎', count: 8, note: '法国收藏家19-20世纪收购', highlight: '周代铭文簋' },
  { museum: '京都泉屋博物馆', city: '京都', count: 6, note: '日本住友家族近代收购', highlight: '商代饕餮方彝' },
];

let currentView = 'excavation';
const ERA_SEQUENCE = ['夏','商','西周','春秋','战国','秦'];
const ERA_COLORS = window.MuseumConstants.ERA_COLORS;
let currentEra = '商';

function setView(view) {
  currentView = view;
  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`view-${view}`).classList.add('active');
  document.getElementById('era-controls').style.display = view === 'overseas' ? 'none' : 'flex';
  document.getElementById('overseas-panel').style.display = view === 'overseas' ? 'block' : 'none';
  renderMap();
  if (view === 'overseas') renderOverseas();
}

function onEraSlider(val) {
  const era = ERA_SEQUENCE[parseInt(val)];
  currentEra = era;
  document.getElementById('era-label').textContent = era;
  document.getElementById('era-label').style.color = ERA_COLORS[era] || 'var(--accent-bronze)';
  renderMap();
  // Emit era-focus event
  document.dispatchEvent(new CustomEvent('era-focus', {
    detail: { dynasty: era, triggered_by: 'geo-system.slider' }
  }));
}

let _realGeo = {}; // { terrain, shang, xizhou, chunqiu, zhanguo, excavation, museums }
let _mapProjection = null;
let _mapGeoPath = null;

async function loadRealGeoData() {
  const eras = ['shang', 'xizhou', 'chunqiu', 'zhanguo'];
  try {
    const [terrain, excavation, museums, ...states] = await Promise.all([
      fetch('../../assets/geo/china-terrain.geojson').then(r => r.json()),
      fetch('../../assets/geo/excavation-sites.geojson').then(r => r.json()),
      fetch('../../assets/geo/museums.geojson').then(r => r.json()),
      ...eras.map(e => fetch(`../../assets/geo/ancient-states-${e}.geojson`).then(r => r.json()))
    ]);
    _realGeo.terrain = terrain;
    _realGeo.excavation = excavation;
    _realGeo.museums = museums;
    eras.forEach((e, i) => { _realGeo[e] = states[i]; });
    renderMap();
  } catch (e) {
    console.warn('[geo-system] real GeoJSON fetch failed, keeping inline fallback:', e.message);
  }
}

// Era → GeoJSON key mapping
const ERA_TO_GEO_KEY = { '商': 'shang', '西周': 'xizhou', '春秋': 'chunqiu', '战国': 'zhanguo' };

function renderMap() {
  const svg = d3.select('#map-svg');
  const container = document.getElementById('map-container');
  const W = container.offsetWidth;
  const H = container.offsetHeight;

  svg.attr('width', W).attr('height', H);
  svg.selectAll('*').remove();

  // Build projection: real China-friendly conic if terrain loaded, else legacy linear [0,1]→px
  const padX = 30, padY = 20;
  if (_realGeo.terrain) {
    _mapProjection = d3.geoConicEqualArea()
      .parallels([25, 47])
      .rotate([-105, 0])
      .fitExtent([[padX, padY], [W - padX, H - padY]], _realGeo.terrain);
    _mapGeoPath = d3.geoPath(_mapProjection);
  } else {
    // Legacy normalized [0,1] → px (sites still use x/y percent)
    _mapProjection = null;
    _mapGeoPath = null;
  }

  // Background
  svg.append('rect').attr('width', W).attr('height', H).attr('fill', '#f4ebd9');

  // China boundary: prefer real terrain GeoJSON, fallback to normalized inline polygon.
  if (_realGeo.terrain && _mapGeoPath) {
    svg.append('path').datum(_realGeo.terrain)
      .attr('d', _mapGeoPath)
      .attr('fill', '#f0e6d0')
      .attr('stroke', '#c8b890')
      .attr('stroke-width', 1.5);
  } else {
    const chinaOutline = [
      [0.35,0.05],[0.50,0.02],[0.60,0.04],[0.72,0.08],[0.80,0.12],
      [0.85,0.20],[0.82,0.28],[0.88,0.38],[0.85,0.46],[0.80,0.52],
      [0.72,0.58],[0.68,0.68],[0.70,0.80],[0.62,0.88],[0.55,0.90],
      [0.48,0.88],[0.42,0.80],[0.35,0.72],[0.28,0.65],[0.20,0.60],
      [0.15,0.50],[0.12,0.40],[0.15,0.30],[0.20,0.22],[0.28,0.15],
      [0.35,0.05]
    ].map(([px,py]) => [px*W, py*H]);
    svg.append('path')
      .datum(chinaOutline)
      .attr('d', d3.line()(chinaOutline) + 'Z')
      .attr('fill', '#f0e6d0')
      .attr('stroke', '#c8b890')
      .attr('stroke-width', 1.5);
  }

  // Rivers (simplified)
  const rivers = [
    [[0.35,0.38],[0.48,0.40],[0.58,0.42],[0.68,0.48],[0.72,0.55]],  // Yellow River (simplified)
    [[0.32,0.52],[0.45,0.50],[0.56,0.52],[0.64,0.56],[0.70,0.60]],  // Yangtze (simplified)
  ];
  rivers.forEach(r => {
    svg.append('path')
      .datum(r.map(([px,py]) => [px*W, py*H]))
      .attr('d', d3.line().curve(d3.curveCatmullRom)(r.map(([px,py]) => [px*W, py*H])))
      .attr('fill', 'none')
      .attr('stroke', '#98b8c8')
      .attr('stroke-width', 1.5)
      .attr('opacity', 0.6);
  });

  // Era overlay: prefer real ancient-states-{era}.geojson, else legacy 7-point polygon.
  const eraKey = ERA_TO_GEO_KEY[currentEra];
  if (eraKey && _realGeo[eraKey] && _mapGeoPath) {
    // Render each ancient-state feature for this era
    _realGeo[eraKey].features.forEach(f => {
      const p = f.properties || {};
      const color = p.color || ERA_COLORS[currentEra] || '#888';
      const opacity = p.opacity != null ? p.opacity : 0.25;
      svg.append('path').datum(f)
        .attr('d', _mapGeoPath)
        .attr('fill', color)
        .attr('fill-opacity', opacity * 0.6)
        .attr('stroke', color)
        .attr('stroke-opacity', 0.5)
        .attr('stroke-width', 1)
        .attr('stroke-dasharray', '4,3');
      // Label at centroid
      const c = d3.geoCentroid(f);
      const [lx, ly] = _mapProjection(c);
      if (lx >= 0 && lx <= W && ly >= 0 && ly <= H) {
        svg.append('text')
          .attr('x', lx).attr('y', ly)
          .attr('text-anchor', 'middle')
          .attr('fill', color)
          .attr('fill-opacity', 0.75)
          .attr('font-size', 10)
          .attr('font-family', 'Noto Serif SC, serif')
          .style('pointer-events', 'none')
          .text(p.name || '');
      }
    });
  } else {
    const eraOverlays = {
      '商': [[0.44,0.30],[0.62,0.30],[0.68,0.40],[0.65,0.52],[0.50,0.55],[0.42,0.48],[0.40,0.38]],
      '西周': [[0.38,0.28],[0.68,0.28],[0.75,0.45],[0.65,0.58],[0.48,0.60],[0.35,0.52],[0.32,0.40]],
      '春秋': [[0.30,0.25],[0.72,0.25],[0.78,0.48],[0.68,0.62],[0.50,0.66],[0.33,0.58],[0.25,0.45]],
      '战国': [[0.28,0.22],[0.75,0.22],[0.80,0.50],[0.70,0.65],[0.52,0.68],[0.30,0.62],[0.22,0.48]],
    };
    if (eraOverlays[currentEra]) {
      const pts = eraOverlays[currentEra].map(([px,py]) => [px*W, py*H]);
      svg.append('path')
        .datum(pts)
        .attr('d', d3.line()(pts) + 'Z')
        .attr('fill', ERA_COLORS[currentEra] || '#888')
        .attr('opacity', 0.08)
        .attr('stroke', ERA_COLORS[currentEra] || '#888')
        .attr('stroke-width', 1.5)
        .attr('stroke-dasharray', '6,4')
        .attr('opacity', 0.3);
    }
  }

  // Sites: prefer real GeoJSON (Point features with [lon,lat]) projected; fallback to inline x/y%.
  const useRealSites = !!(_mapProjection && (
    (currentView === 'museum' && _realGeo.museums) ||
    (currentView !== 'museum' && _realGeo.excavation)
  ));
  let sites;
  if (useRealSites) {
    const fc = currentView === 'museum' ? _realGeo.museums : _realGeo.excavation;
    sites = fc.features.map(f => {
      const p = f.properties || {};
      const [lon, lat] = f.geometry.coordinates;
      return {
        name: p.name,
        dynasty: p.dynasty || '',
        desc: p.brief || p.description || '',
        count: p.artifact_count || p.bronze_count_approx || p.user_collected || 1,
        artifacts: p.key_artifacts || [],
        lit: p.user_collected !== undefined ? p.user_collected > 0 : true,
        _lon: lon, _lat: lat,
      };
    });
  } else {
    sites = currentView === 'museum' ? MUSEUM_SITES : EXCAVATION_SITES;
  }

  sites.forEach(site => {
    let cx, cy;
    if (useRealSites && _mapProjection) {
      const proj = _mapProjection([site._lon, site._lat]);
      if (!proj || isNaN(proj[0])) return;
      [cx, cy] = proj;
    } else {
      cx = site.x / 100 * W;
      cy = site.y / 100 * H;
    }
    const isLit = currentView === 'museum' ? true : (site.lit && (site.dynasty === currentEra || currentView === 'excavation'));
    const color = ERA_COLORS[site.dynasty] || ERA_COLORS[currentEra] || '#888';
    // Real GeoJSON counts are 10-500+ (artifact_count or bronze_count_approx);
    // inline counts are 2-85. Use sqrt with a per-mode multiplier so both fit nicely.
    const radMult = useRealSites ? 1.0 : 2.5;
    const r = Math.max(5, Math.min(22, Math.sqrt(site.count) * radMult));

    const g = svg.append('g').attr('class', 'site-circle');

    if (isLit && site.count > 0) {
      // Glow for lit sites
      g.append('circle').attr('cx', cx).attr('cy', cy)
        .attr('r', r + 4).attr('fill', color).attr('opacity', 0.15);
    }

    g.append('circle')
      .attr('cx', cx).attr('cy', cy).attr('r', r)
      .attr('fill', isLit ? color : '#ccc')
      .attr('opacity', isLit ? 0.85 : 0.4)
      .attr('stroke', isLit ? 'white' : 'none')
      .attr('stroke-width', 1);

    // Count label inside circle
    if (r > 10) {
      g.append('text').attr('x', cx).attr('y', cy + 3)
        .attr('text-anchor', 'middle').attr('font-size', 9)
        .attr('fill', 'white').attr('font-weight', '600').text(site.count);
    }

    // Site name label
    g.append('text')
      .attr('class', 'site-label')
      .attr('x', cx + r + 4).attr('y', cy + 3)
      .attr('fill', isLit ? '#333' : '#aaa')
      .attr('font-size', 11).attr('font-weight', isLit ? '600' : '400')
      .text(site.name);

    g.on('click', () => showSiteDetail(site));
    g.on('mouseenter', function() {
      d3.select(this).select('circle').attr('stroke-width', 2).attr('stroke', ERA_COLORS[site.dynasty] || 'var(--accent-bronze)');
    });
    g.on('mouseleave', function() {
      d3.select(this).select('circle').attr('stroke-width', 1).attr('stroke', 'white');
    });
  });

  // North indicator
  svg.append('text').attr('x', W - 30).attr('y', 25).attr('font-size', 16).attr('fill', '#888').text('N↑');
}

function showSiteDetail(site) {
  const panel = document.getElementById('detail-panel');
  const isExcav = currentView === 'excavation';
  panel.innerHTML = `
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
      <div style="width:12px; height:12px; border-radius:50%; background:${ERA_COLORS[site.dynasty]||'#888'};"></div>
      <div style="font-size:18px; font-weight:700;">${site.name}</div>
      ${site.dynasty ? `<div style="font-size:12px; color:var(--text-muted);">${site.dynasty}代</div>` : ''}
    </div>
    <div style="font-size:13px; color:var(--text-ink); line-height:1.7; margin-bottom:12px;">${site.desc}</div>
    <div style="margin-bottom:12px;">
      <div class="field-label">收藏器物</div>
      <div style="font-size:20px; font-weight:700; color:var(--accent-bronze);">${site.count} 件</div>
    </div>
    ${(site.artifacts||[]).length > 0 ? `
    <div>
      <div class="field-label" style="margin-bottom:6px;">代表器物：</div>
      ${site.artifacts.map(a => `
        <div style="padding:6px 8px; background:var(--bg-cream); border-radius:6px; font-size:12px; cursor:pointer; margin-bottom:4px;"
          onclick="location.href='catalog.html?search=${encodeURIComponent(a)}'">🏺 ${a}</div>
      `).join('')}
    </div>
    ` : ''}
    <div style="margin-top:16px;">
      <a href="catalog.html?geo=${encodeURIComponent(site.name)}" style="color:var(--accent-bronze); font-size:12px; text-decoration:none;">→ 查看全部来自${site.name}的器物</a>
    </div>
  `;
  // Emit site-focus
  document.dispatchEvent(new CustomEvent('region-focus', { detail: { site: site.name, dynasty: site.dynasty, triggered_by: 'geo-system.click' } }));
}

function renderOverseas() {
  const list = document.getElementById('overseas-list');
  list.innerHTML = OVERSEAS_ITEMS.map(item => `
    <div class="overseas-item">
      <div style="font-size:24px;">🌐</div>
      <div style="flex:1;">
        <div style="font-size:14px; font-weight:600; margin-bottom:4px;">${item.museum}</div>
        <div style="font-size:12px; color:var(--text-muted); margin-bottom:4px;">${item.city} · ${item.count} 件已知</div>
        <div style="font-size:11px; color:var(--text-muted); line-height:1.5;">${item.note}</div>
        <div style="font-size:11px; color:var(--accent-bronze); margin-top:4px;">${item.highlight}</div>
      </div>
    </div>
  `).join('');
}

// Listen for era-focus from other components
document.addEventListener('era-focus', function(e) {
  const { dynasty } = e.detail || {};
  if (!dynasty || !window.CrossDimWiring || !window.CrossDimWiring.isEnabled()) return;
  currentEra = dynasty;
  const idx = ERA_SEQUENCE.indexOf(dynasty);
  if (idx >= 0) {
    document.getElementById('era-slider').value = idx;
    document.getElementById('era-label').textContent = dynasty;
    document.getElementById('era-label').style.color = ERA_COLORS[dynasty] || 'var(--accent-bronze)';
  }
  renderMap();
});

document.addEventListener('DOMContentLoaded', () => {
  renderMap();
  // Upgrade to real GeoJSON (B1 phase data) once available; re-renders map.
  loadRealGeoData();
  window.addEventListener('resize', renderMap);
});
</script>
</body>
</html>
