<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图鉴 — MuseumCollect v3</title>
<link rel="stylesheet" href="css/converged.css">
<style>
.filter-chip {
  padding: 4px 12px; border-radius: 20px; font-size: 12px; cursor: pointer;
  border: 1px solid var(--border-medium); background: white; color: var(--text-muted);
  transition: all .2s; white-space: nowrap;
}
.filter-chip.active { background: var(--accent-bronze); color: white; border-color: var(--accent-bronze); }
.catalog-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px;
}
.art-card {
  background: white; border-radius: 10px; border: 1px solid var(--border-light);
  box-shadow: var(--shadow-sm); cursor: pointer; transition: all .25s; overflow: hidden;
  position: relative;
}
.art-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--accent-bronze); }
.art-card.treasure { border: 1.5px solid var(--accent-gold); box-shadow: 0 0 8px rgba(212,168,87,.25); }
.art-card.collected { background: #fffcf5; }
.art-card-img { aspect-ratio: 1; background: var(--bg-cream); display: flex; align-items: center; justify-content: center; padding: 8px; }
.art-card-img img { width: 70%; height: 70%; object-fit: contain; opacity: .75; }
.art-card-body { padding: 10px; }
.art-card-name { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.art-card-meta { font-size: 10px; color: var(--text-muted); }
.rarity-halo { position: absolute; top: 6px; right: 6px; font-size: 9px; padding: 1px 5px; border-radius: 3px; }
.rarity-halo.treasure { background: var(--accent-red); color: white; }
.collected-dot { position: absolute; top: 6px; left: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-bronze); }
.pokedex-tree { display: flex; flex-direction: column; gap: 8px; }
.form-parent { font-size: 16px; font-weight: 700; padding: 10px; background: var(--bg-cream); border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.form-children { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 16px 8px 28px; }
.form-child-chip { padding: 4px 10px; border-radius: 20px; font-size: 12px; border: 1px solid var(--border-light); background: white; cursor: pointer; transition: all .2s; }
.form-child-chip:hover, .form-child-chip.active { border-color: var(--accent-bronze); color: var(--accent-bronze); }
.search-input { width: 100%; padding: 10px 16px; border: 1px solid var(--border-medium); border-radius: 8px; font-family: inherit; font-size: 13px; background: white; outline: none; transition: border .2s; }
.search-input:focus { border-color: var(--accent-bronze); }
</style>
</head>
<body data-page="catalog">

<nav id="top-nav-placeholder" class="top-nav"></nav>
<script src="js/nav.js"></script>

<div class="page-container" style="padding:24px;">
  <div style="display:flex; align-items:baseline; gap:16px; margin-bottom:20px;">
    <h1 class="page-title" style="margin:0;">青铜器图鉴</h1>
    <span class="text-muted text-sm">275 件 · 已收藏 25 件</span>
  </div>

  <div class="tab-bar" style="margin-bottom:0;">
    <button class="tab-btn active" onclick="switchTab('form')">形制谱系</button>
    <button class="tab-btn" onclick="switchTab('era')">时代</button>
    <button class="tab-btn" onclick="switchTab('geo')">地理</button>
    <button class="tab-btn" onclick="switchTab('pattern')">纹饰</button>
    <button class="tab-btn" onclick="switchTab('inscription')">铭文</button>
  </div>

  <div style="background:white; border:1px solid var(--border-light); border-top:none; padding:16px; border-radius:0 0 8px 8px; margin-bottom:24px;">
    <!-- Search -->
    <div style="margin-bottom:16px;">
      <input type="text" class="search-input" id="search-input" placeholder="搜索器名、朝代、纹饰..." oninput="filterArtifacts()">
    </div>

    <!-- Form tab: Pokédex tree -->
    <div id="tab-form" class="tab-panel active">
      <div class="pokedex-tree" id="form-tree"></div>
    </div>

    <!-- Era tab -->
    <div id="tab-era" class="tab-panel">
      <div style="display:flex; flex-wrap:wrap; gap:6px;" id="era-filters"></div>
    </div>

    <!-- Geo tab -->
    <div id="tab-geo" class="tab-panel">
      <div style="display:flex; flex-wrap:wrap; gap:6px;" id="geo-filters"></div>
    </div>

    <!-- Pattern tab -->
    <div id="tab-pattern" class="tab-panel">
      <div style="display:flex; flex-wrap:wrap; gap:6px;" id="pattern-filters"></div>
    </div>

    <!-- Inscription tab -->
    <div id="tab-inscription" class="tab-panel">
      <div style="display:flex; flex-wrap:wrap; gap:6px;">
        <span class="filter-chip" onclick="setFilter('inscription','has')">有铭文</span>
        <span class="filter-chip" onclick="setFilter('inscription','long')">长铭(100+字)</span>
        <span class="filter-chip" onclick="setFilter('inscription','none')">无铭</span>
      </div>
    </div>
  </div>

  <!-- Grid -->
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
    <div class="text-muted text-sm" id="grid-count">显示 <strong id="count-num">50</strong> 件</div>
    <div style="display:flex; gap:8px; align-items:center;">
      <span class="filter-chip" onclick="setFilter('collected','yes')">仅已收藏</span>
      <span class="filter-chip" onclick="setFilter('rarity','国宝')">仅国宝</span>
      <span class="filter-chip active" id="filter-reset" onclick="resetFilters()">全部</span>
    </div>
  </div>

  <div class="catalog-grid" id="catalog-grid"></div>
</div>

<script src="js/constants.js"></script>
<script src="js/state.js"></script>
<script src="js/data-loader.js"></script>
<script src="js/cross-dim-wiring.js"></script>
<script>

// Adapter: build full catalog from MuseumData.artifacts (275 records).
// Maps segment JSON record shape → catalog item shape used by matchesFilters/renderGrid.
function buildCatalogItemsFromMuseumData() {
  if (!window.MuseumData || !Array.isArray(window.MuseumData.artifacts)) return null;
  const SITE_HINTS = ['殷墟','三星堆','盘龙城','二里头','随州','满城','宝鸡','岐山','扶风','眉县','临潼','宁乡','江陵','新郑','武汉','广汉','曲沃','平山','长沙','诸城','安阳','洛阳','成都'];
  return window.MuseumData.artifacts.map(a => {
    const patterns = [];
    const ps = a.patterns_structured || {};
    ['main','secondary'].forEach(k => {
      (ps[k] || []).forEach(s => {
        const name = String(s).split(' — ')[0].split('—')[0].trim();
        if (name && !patterns.includes(name)) patterns.push(name);
      });
    });
    const fullSite = (a.excavation && a.excavation.site) || '';
    let site = '';
    for (const h of SITE_HINTS) if (fullSite.includes(h)) { site = h; break; }
    if (!site) {
      const m = fullSite.match(/^([^省市,、]+(?:省|市))/);
      site = m ? m[1] : (fullSite.split(/[、,]/)[0] || fullSite.substring(0, 8));
    }
    return {
      id: a.id,
      name: a.name_zh,
      dynasty: a.dynasty || '',
      form: a.form_subtype || a.type || '',
      site,
      rarity: a.rarity_level || '一级',
      patterns,
      inscription: (a.inscription && a.inscription.has) ? '有' : '无',
      char_count: (a.inscription && a.inscription.char_count) || 0,
    };
  });
}

const FORM_TREE = {
  '炊器': ['方鼎','圆鼎','鬲','甗'],
  '食器': ['簋','簠','盨','敦','豆'],
  '酒器': ['尊','方尊','鸮尊','爵','觚','壶','方壶','卣','觥','方彝'],
  '水器': ['盘','匜','鉴'],
  '乐器': ['编钟','铙','镈'],
  '兵器': ['剑','戈','矛','钺'],
  '其他': ['量器','炉','灯','人像','面具'],
};

let activeFilters = { form: null, era: null, geo: null, pattern: null, inscription: null, collected: null, rarity: null };
let activeTab = 'form';

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');
}

function setFilter(type, value) {
  if (activeFilters[type] === value) {
    activeFilters[type] = null;
  } else {
    activeFilters[type] = value;
  }
  renderGrid();
}

function resetFilters() {
  activeFilters = { form: null, era: null, geo: null, pattern: null, inscription: null, collected: null, rarity: null };
  document.getElementById('search-input').value = '';
  renderGrid();
}

function filterArtifacts() { renderGrid(); }

function matchesFilters(item) {
  const search = document.getElementById('search-input').value.toLowerCase();
  if (search && !item.name.includes(search) && !item.dynasty.includes(search) && !(item.form||'').includes(search)) return false;
  if (activeFilters.form && item.form !== activeFilters.form) return false;
  if (activeFilters.era && item.dynasty !== activeFilters.era) return false;
  if (activeFilters.geo && item.site !== activeFilters.geo) return false;
  if (activeFilters.pattern && !(item.patterns||[]).includes(activeFilters.pattern)) return false;
  if (activeFilters.inscription === 'has' && item.inscription !== '有') return false;
  if (activeFilters.inscription === 'long' && item.char_count < 100) return false;
  if (activeFilters.inscription === 'none' && item.inscription !== '无') return false;
  if (activeFilters.collected === 'yes') {
    const collected = (window.MuseumData && window.MuseumData.collected) || new Set();
    if (!collected.has(item.id)) return false;
  }
  if (activeFilters.rarity === '国宝' && item.rarity !== '国宝') return false;
  return true;
}

// Silhouette helper: delegate to MuseumConstants (defined in constants.js)
const getSilhouette = (form) => window.MuseumConstants.getSilhouette(form);

function renderGrid() {
  const filtered = CATALOG_ITEMS.filter(matchesFilters);
  document.getElementById('count-num').textContent = filtered.length;
  const grid = document.getElementById('catalog-grid');
  const collectedIds = (window.MuseumData && window.MuseumData.collected) || new Set();
  grid.innerHTML = filtered.map(item => {
    const silh = getSilhouette(item.form);
    const isC = collectedIds.has(item.id);
    const isT = item.rarity === '国宝';
    return `
    <div class="art-card ${isT?'treasure':''} ${isC?'collected':''}" onclick="location.href='artifact.html?id=${item.id}'">
      ${isC ? '<div class="collected-dot"></div>' : ''}
      ${isT ? '<div class="rarity-halo treasure">国宝</div>' : ''}
      <div class="art-card-img" style="overflow:hidden;">
        ${(function(){const ph=getPhotoUrl(item.id);return ph?`<img src="${ph}" alt="${item.name}" style="width:100%;height:100%;object-fit:cover;" onerror="this.onerror=null;this.src='../../assets/silhouettes/${silh}.svg';this.style.objectFit='contain';this.style.padding='16px';">`:`<img src="../../assets/silhouettes/${silh}.svg" alt="${item.name}" onerror="this.style.display='none';this.parentNode.innerHTML='<span style=\\'font-size:36px;opacity:.3;\\'>🏺</span>'">`;})()}
      </div>
      <div class="art-card-body">
        <div class="art-card-name">${item.name}</div>
        <div class="art-card-meta">${item.dynasty} · ${item.form}</div>
        <div class="art-card-meta" style="color:var(--text-light);">${item.site||''}</div>
      </div>
    </div>`;
  }).join('') + (filtered.length < 275 ? '' : `
    <div class="art-card" style="border-style:dashed; display:flex; align-items:center; justify-content:center; min-height:120px; color:var(--text-muted); font-size:12px;">
      + ${275 - filtered.length} 件更多…
    </div>`);
}

// Build Pokédex tree filter
function buildFormTree() {
  const tree = document.getElementById('form-tree');
  Object.entries(FORM_TREE).forEach(([parent, children]) => {
    const block = document.createElement('div');
    block.innerHTML = `
      <div class="form-parent" onclick="toggleFormGroup(this)">
        <span>▶</span> ${parent}
      </div>
      <div class="form-children" style="display:none;">
        ${children.map(c => `<span class="form-child-chip" onclick="setFilter('form','${c}'); event.stopPropagation();">${c}</span>`).join('')}
      </div>`;
    tree.appendChild(block);
  });
}

function toggleFormGroup(el) {
  const children = el.nextElementSibling;
  const arrow = el.querySelector('span');
  if (children.style.display === 'none') {
    children.style.display = 'flex';
    arrow.textContent = '▼';
  } else {
    children.style.display = 'none';
    arrow.textContent = '▶';
  }
}

// Build era filters
function buildEraFilters() {
  const eras = ['夏','商','西周','春秋','战国','秦','西汉','东汉'];
  const colors = {'夏':'#6e4a2e','商':'#4a5a3a','西周':'#a73a2a','春秋':'#2a2a3a','战国':'#7a3a2a','秦':'#1a1a1a','西汉':'#b89046','东汉':'#9a7838'};
  const container = document.getElementById('era-filters');
  eras.forEach(era => {
    const el = document.createElement('span');
    el.className = 'filter-chip';
    el.textContent = era;
    el.style.borderLeftColor = colors[era];
    el.style.borderLeftWidth = '3px';
    el.addEventListener('click', () => {
      container.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      setFilter('era', era);
      if (window.CrossDimWiring) window.CrossDimWiring.emitEra(era, 'catalog.era-filter');
    });
    container.appendChild(el);
  });
}

// Build pattern filters
function buildPatternFilters() {
  const patterns = ['饕餮纹','夔龙纹','云雷纹','凤鸟纹','蟠螭纹','窃曲纹','重环纹','蟠虺纹','错金银'];
  const container = document.getElementById('pattern-filters');
  patterns.forEach(p => {
    const el = document.createElement('span');
    el.className = 'filter-chip';
    el.textContent = p;
    el.addEventListener('click', () => {
      container.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      setFilter('pattern', p);
    });
    container.appendChild(el);
  });
}

// Build geo filters
function buildGeoFilters() {
  const sites = ['殷墟','周原','三星堆','随州','河南新郑','湖北江陵','陕西宝鸡','河北满城','陕西咸阳'];
  const container = document.getElementById('geo-filters');
  sites.forEach(s => {
    const el = document.createElement('span');
    el.className = 'filter-chip';
    el.textContent = s;
    el.addEventListener('click', () => {
      container.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      setFilter('geo', s);
    });
    container.appendChild(el);
  });
}

document.addEventListener('DOMContentLoaded', () => {
  buildFormTree();
  buildEraFilters();
  buildPatternFilters();
  buildGeoFilters();
  renderGrid();
  // Swap to full 275-record catalog when MuseumData finishes loading
  document.addEventListener('museum-data-ready', () => {
    const full = buildCatalogItemsFromMuseumData();
    if (full && full.length > 0) CATALOG_ITEMS = full;
    renderGrid();
  });
  // Also try swap if MuseumData is already ready (race-safe)
  if (window.MuseumData && Array.isArray(window.MuseumData.artifacts) && window.MuseumData.artifacts.length > 0) {
    const full = buildCatalogItemsFromMuseumData();
    if (full && full.length > 0) { CATALOG_ITEMS = full; renderGrid(); }
  }

  // Listen for era-focus from other components (穿越模式)
  document.addEventListener('era-focus', (e) => {
    const { dynasty } = e.detail || {};
    if (dynasty && window.CrossDimWiring && window.CrossDimWiring.isEnabled()) {
      activeFilters.era = dynasty;
      renderGrid();
    }
  });

  // Handle URL params
  const params = new URLSearchParams(location.search);
  if (params.get('type')) { activeFilters.form = params.get('type'); renderGrid(); }
  if (params.get('era')) { activeFilters.era = params.get('era'); renderGrid(); }
});
</script>
