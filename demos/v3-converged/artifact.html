<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文物详情 — MuseumCollect v3</title>
<link rel="stylesheet" href="css/converged.css">
<style>
.artifact-image-box {
  width: 280px; aspect-ratio: 1; background: var(--bg-dark);
  border-radius: 12px; display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden; flex-shrink: 0;
}
.artifact-image-box.treasure {
  box-shadow: 0 0 30px rgba(212,168,87,.4), 0 0 60px rgba(212,168,87,.15);
  border: 2px solid var(--accent-gold);
}
.silhouette-img { width: 70%; height: 70%; object-fit: contain; opacity: .8; filter: invert(1); }
.photo-img { width: 100%; height: 100%; object-fit: cover; }
.view-toggle { display: flex; gap: 4px; margin-top: 8px; justify-content: center; }
.view-btn {
  padding: 4px 12px; font-size: 11px; border-radius: 20px; cursor: pointer;
  border: 1px solid var(--border-medium); background: white; color: var(--text-muted); transition: all .2s;
}
.view-btn.active { background: var(--accent-bronze); color: white; border-color: var(--accent-bronze); }
.insc-grid { display: flex; flex-wrap: wrap; gap: 4px; }
.insc-tooltip {
  position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
  background: white; border: 1px solid var(--border-medium);
  border-radius: 8px; padding: 8px 10px; min-width: 120px; z-index: 20;
  box-shadow: var(--shadow-md); pointer-events: none; opacity: 0; transition: opacity .2s;
  font-size: 12px; text-align: center;
}
.insc-char:hover .insc-tooltip { opacity: 1; }
.craft-chip {
  display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px;
  border: 1px solid var(--border-light); border-radius: 20px; font-size: 11px;
  color: var(--text-muted); background: white; cursor: default; transition: all .2s;
}
.craft-chip:hover { border-color: var(--accent-bronze); color: var(--accent-bronze); }
.pattern-badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px;
  border: 1px solid var(--border-light); border-radius: 4px; font-size: 12px;
  background: white; cursor: pointer; transition: all .2s;
}
.pattern-badge:hover { border-color: var(--accent-bronze); background: #fdf8f0; }
.dim-accordion details > summary {
  cursor: pointer; padding: 12px 0; font-size: 13px; font-weight: 600;
  color: var(--accent-bronze); list-style: none; display: flex; align-items: center; gap: 6px;
  border-bottom: 1px solid var(--border-light);
}
.dim-accordion details > summary::before { content: '▶'; font-size: 10px; transition: transform .2s; }
.dim-accordion details[open] > summary::before { transform: rotate(90deg); }
</style>
</head>
<body data-page="">

<nav id="top-nav-placeholder" class="top-nav"></nav>
<script src="js/nav.js"></script>

<div id="artifact-content">
  <!-- Rendered by JS -->
  <div style="text-align:center; padding:80px; color:var(--text-muted);">加载中...</div>
</div>

<script src="js/constants.js"></script>
<script src="js/state.js"></script>
<script src="js/cross-dim-wiring.js"></script>
<script src="js/data-loader.js"></script>
<script>
// Normalize a segment JSON record into the shape renderArtifact expects.
// Segment data may have slightly different field shapes (inscription as bool,
// craft as string, data_sources as objects, etc.) — this defends each access.
function normalizeRecord(r) {
  const i = r.inscription || {};
  const p = r.purpose || {};
  const c = r.craft || {};
  const ds = r.data_sources || [];
  return {
    id: r.id,
    name_zh: r.name_zh || r.name || r.id,
    name_pinyin: r.name_pinyin || '',
    name_alt: r.name_alt || [],
    dynasty: r.dynasty || '未知',
    period: r.period || '',
    approx_year: r.approx_year || '',
    rarity_level: r.rarity_level || '一般',
    // v3 data is inconsistent: shang segment nests these under `excavation`,
    // other segments keep them flat. Read both shapes so neither shows "undefined".
    excavation: (function(){ const e = r.excavation || {}; return {
      year:          e.year || r.excavation_year || '',
      site:          e.site || r.excavation_site || '',
      ancient_state: e.ancient_state || r.ancient_state || '',
      dating_method: e.dating_method || r.dating_method || '',
      significance:  e.significance || r.excavation_significance || ''
    }; })(),
    current_museum: r.current_museum || '不详',
    size: r.size || {},
    type: r.type || '',
    form_subtype: r.form_subtype || '',
    form_detail: r.form_detail || '',
    distinctive_features: r.distinctive_features || [],
    patterns_structured: r.patterns_structured || {},
    inscription: (typeof i === 'boolean')
      ? { has: i, text: '', char_count: 0, summary: '', stage: '' }
      : {
          has: i.has !== undefined ? i.has : !!(i.text || (i.char_count || 0) > 0),
          text: i.text || '',
          char_count: i.char_count || (i.text ? i.text.length : 0),
          summary: i.summary || '',
          stage: i.stage || ''
        },
    purpose: (typeof p === 'string')
      ? { primary: p, context: '', user_class: '' }
      : { primary: p.primary || '', context: p.context || '', user_class: p.user_class || '' },
    craft: (typeof c === 'string')
      ? { primary: c, details: '' }
      : { primary: c.primary || '', details: c.details || '' },
    scholarly_status: r.scholarly_status || '',
    provenance_timeline: r.provenance_timeline || [],
    related_artifacts: r.related_artifacts || [],
    data_sources: ds.map(s => typeof s === 'string' ? s : (s.source || s.url || s.title || JSON.stringify(s))),
    image_urls: r.image_urls || []
  };
}

function getRarityClass(level) {
  if (level === '国宝') return 'rarity-treasure';
  if (level === '一级') return 'rarity-first';
  if (level === '二级') return 'rarity-second';
  return '';
}

// Silhouette helper: delegate to MuseumConstants (defined in constants.js)
const getSilhouetteFor = (form_subtype) => window.MuseumConstants.getSilhouette(form_subtype);

function renderArtifact(data) {
  const isCollected = window.CollectionState && window.CollectionState.isCollected(data.id);
  const rarityClass = getRarityClass(data.rarity_level);
  const silhouette = getSilhouetteFor(data.form_subtype);
  const inscChars = data.inscription.text ? data.inscription.text.split('') : [];
  const archive = (window.ARTIFACT_ARCHIVES || {})[data.id];
  const hasWiki = (window.WIKI_ARTIFACT_SLUGS || new Set()).has(data.id);

  // Photo-first: real photo at assets/photos/<id>.jpg (build-time fetched) if this
  // id is in PHOTO_IDS, else null → silhouette. <img onerror> below also guards 404.
  const photoUrl = (window.MuseumData && window.MuseumData.getPhotoUrl) ? window.MuseumData.getPhotoUrl(data.id, '../../') : null;
  const silhouetteUrl = `../../assets/silhouettes/${silhouette}.svg`;
  const hasPhoto = !!photoUrl;
  const initSrc = hasPhoto ? photoUrl : silhouetteUrl;
  const initClass = hasPhoto ? 'photo-img' : 'silhouette-img';

  const html = `
  <!-- Hero -->
  <div class="artifact-hero">
    <div class="page-container" style="position:relative; z-index:1;">
      <div class="artifact-hero-flex">
        <!-- Image box -->
        <div>
          <div class="artifact-image-box ${data.rarity_level==='国宝'?'treasure':''}">
            ${data.rarity_level==='国宝' ? '<div class="rarity-badge">国之重器</div>' : ''}
            <img id="artifact-img" class="${initClass}"
              src="${initSrc}"
              data-photo-url="${photoUrl || ''}"
              data-silhouette-url="${silhouetteUrl}"
              onerror="this.onerror=null;this.src='${silhouetteUrl}';this.className='silhouette-img';"
              alt="${data.name_zh}">
          </div>
          <div class="view-toggle">
            <button class="view-btn${hasPhoto ? ' active' : ''}" onclick="switchView('photo')">实景</button>
            <button class="view-btn${!hasPhoto ? ' active' : ''}" onclick="switchView('silhouette')">线稿</button>
          </div>
        </div>

        <!-- Meta -->
        <div style="flex:1; color:white;">
          <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
            ${data.rarity_level==='国宝' ? '<span class="chop" style="border-color:var(--accent-gold); color:var(--accent-gold);">国之重器</span>' : ''}
            <span class="chop" style="border-color:rgba(255,255,255,.3); color:rgba(255,255,255,.6);">${data.dynasty}·${data.period}</span>
            <span class="chop" style="border-color:rgba(255,255,255,.3); color:rgba(255,255,255,.6);">${data.form_subtype || data.type}</span>
            <span class="chop" style="border-color:rgba(255,255,255,.3); color:rgba(255,255,255,.6);">${data.current_museum}</span>
          </div>
          <h1 style="font-size:40px; font-weight:700; margin-bottom:8px;">${data.name_zh}</h1>
          <div style="font-size:16px; color:rgba(255,255,255,.6); margin-bottom:4px;">${data.name_pinyin || ''}</div>
          ${(data.name_alt||[]).length > 0 ? `<div style="font-size:13px; color:rgba(255,255,255,.4);">别名：${data.name_alt.join(' / ')}</div>` : ''}

          <div style="display:flex; gap:24px; margin-top:20px; flex-wrap:wrap;">
            ${data.size.height_cm ? `<div><div class="field-label" style="color:rgba(255,255,255,.4);">通高</div><div style="font-size:20px; font-weight:700; color:white;">${data.size.height_cm} cm</div></div>` : ''}
            ${data.size.weight_kg ? `<div><div class="field-label" style="color:rgba(255,255,255,.4);">重量</div><div style="font-size:20px; font-weight:700; color:white;">${data.size.weight_kg} kg</div></div>` : ''}
            <div><div class="field-label" style="color:rgba(255,255,255,.4);">铸造</div><div style="font-size:16px; color:white;">${data.approx_year}</div></div>
          </div>

          <div style="margin-top:20px;">
            <button id="collect-btn" onclick="toggleCollect('${data.id}')"
              style="padding:10px 24px; border-radius:6px; font-size:14px; cursor:pointer; font-family:inherit; transition:all .2s;
                     ${isCollected ? 'background:var(--accent-bronze); color:white; border:2px solid var(--accent-bronze);' : 'background:transparent; color:white; border:2px solid rgba(255,255,255,.5);'}">
              ${isCollected ? '✓ 已收藏' : '+ 加入收藏'}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="page-container" style="padding:32px 24px;">
    <div style="display:grid; grid-template-columns:2fr 1fr; gap:24px;">
      <div class="dim-accordion">

        <!-- 1. 基本信息 -->
        <div class="dim-card" style="margin-bottom:16px;">
          <div class="dim-card-title">① 基本信息</div>
          <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;">
            <div><div class="field-label">朝代</div><div class="field-value">${data.dynasty}</div></div>
            <div><div class="field-label">分期</div><div class="field-value">${data.period}</div></div>
            <div><div class="field-label">器型</div><div class="field-value">${data.form_subtype || data.type}</div></div>
            <div><div class="field-label">通高</div><div class="field-value">${data.size.height_cm || '—'} cm</div></div>
            <div><div class="field-label">重量</div><div class="field-value">${data.size.weight_kg || '—'} kg</div></div>
            <div><div class="field-label">馆藏</div><div class="field-value">${data.current_museum}</div></div>
          </div>
        </div>

        <!-- 2. 出土信息 -->
        <details class="dim-card" style="margin-bottom:16px;" open>
          <summary>② 出土信息</summary>
          <div style="padding-top:12px;">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
              <div><div class="field-label">出土年份</div><div class="field-value">${data.excavation.year ? data.excavation.year + ' 年' : '—'}</div></div>
              <div><div class="field-label">出土地点</div><div class="field-value">${data.excavation.site || '—'}</div></div>
              <div><div class="field-label">古国归属</div><div class="field-value">${data.excavation.ancient_state || '—'}</div></div>
              <div><div class="field-label">断代方法</div><div class="field-value">${data.excavation.dating_method || '—'}</div></div>
            </div>
            ${data.excavation.significance ? `<div style="margin-top:10px; padding:10px; background:var(--bg-cream); border-radius:6px; font-size:13px; color:var(--text-muted);">
              ${data.excavation.significance}
            </div>` : ''}
          </div>
        </details>

        <!-- 3. 形制描述 -->
        <details class="dim-card" style="margin-bottom:16px;" open>
          <summary>③ 形制 · 工艺</summary>
          <div style="padding-top:12px;">
            <div style="font-size:13px; margin-bottom:12px;">${data.form_detail}</div>
            <div style="margin-bottom:8px; font-size:12px; font-weight:600; color:var(--text-muted);">工艺特征：</div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              <span class="craft-chip" title="${data.craft.details}">${data.craft.primary}</span>
              ${data.distinctive_features.map(f=>`<span class="craft-chip">${f}</span>`).join('')}
            </div>
            <div style="margin-top:10px; font-size:12px; color:var(--text-muted);">${data.craft.details}</div>
          </div>
        </details>

        <!-- 4. 纹饰 -->
        <details class="dim-card" style="margin-bottom:16px;" open>
          <summary>④ 纹饰分析</summary>
          <div style="padding-top:12px;">
            ${Object.entries(data.patterns_structured).map(([layer, pats]) => `
              <div style="margin-bottom:10px;">
                <div class="field-label">${{main:'主纹',secondary:'辅纹',ground:'底纹',rim:'边纹'}[layer]||layer}</div>
                <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;">
                  ${pats.map(p => {
                    const slug = p.split('纹')[0].toLowerCase().replace(/[^a-z]/g,'');
                    return `<span class="pattern-badge" data-pattern="${p}" onclick="highlightPattern('${p}')">
                      <img src="../../assets/patterns/${slug}.svg" style="width:16px;height:16px;" onerror="this.style.display='none'">
                      ${p}
                    </span>`;
                  }).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        </details>

        <!-- 5. 铭文 -->
        <details class="dim-card" style="margin-bottom:16px;" ${data.inscription.has ? 'open' : ''}>
          <summary>⑤ 铭文 · 金文 ${data.inscription.has ? `(${data.inscription.char_count}字)` : '(无铭)'}</summary>
          <div style="padding-top:12px;">
            ${data.inscription.has ? `
              <div style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">${data.inscription.stage}</div>
              <div class="insc-grid" style="margin-bottom:12px;">
                ${inscChars.slice(0,30).map(c => `
                  <div class="insc-char recognized" style="position:relative;" title="${c}字 — 点击查看">
                    ${c}
                    <div class="insc-tooltip">${c}<br><span style="font-size:10px;color:#888;">点击进入释读</span></div>
                  </div>
                `).join('')}
                ${data.inscription.char_count > 30 ? `<div class="insc-char" style="color:var(--text-muted);">…+${data.inscription.char_count-30}</div>` : ''}
              </div>
              <div style="font-size:13px; color:var(--text-ink); line-height:1.7; margin-bottom:10px;">${data.inscription.summary}</div>
              <a href="inscription-reader.html?id=${data.id}" style="color:var(--accent-bronze); font-size:13px; text-decoration:none;">→ 进入铭文释读器</a>
            ` : '<div style="color:var(--text-muted); font-size:13px;">此器无铭文记录</div>'}
          </div>
        </details>

        <!-- 6. 用途 / 礼制 -->
        <details class="dim-card" style="margin-bottom:16px;" open>
          <summary>⑥ 用途 · 礼制</summary>
          <div style="padding-top:12px;">
            <div style="display:flex; gap:16px; margin-bottom:10px;">
              <div><div class="field-label">主要用途</div><div class="field-value">${data.purpose.primary}</div></div>
              <div><div class="field-label">使用者等级</div><div class="field-value">${data.purpose.user_class}</div></div>
            </div>
            <div style="font-size:13px; color:var(--text-muted); line-height:1.7;">${data.purpose.context}</div>
            <div style="margin-top:10px;">
              <a href="purpose-scene.html?form=${data.form_subtype}" style="color:var(--accent-bronze); font-size:13px; text-decoration:none;">→ 在礼制场景中归位</a>
            </div>
          </div>
        </details>

      </div>

      <!-- Right column: scholarly + provenance + related -->
      <div>
        ${hasWiki ? `<a class="dim-card" href="wiki.html?entry=${encodeURIComponent(data.id)}" style="display:block; margin-bottom:16px; text-decoration:none; border-left:3px solid var(--accent-bronze);">
          <div class="dim-card-title" style="color:var(--accent-bronze);">📖 完整百科档案</div>
          <div style="font-size:13px; color:var(--text-muted); line-height:1.6;">深度档案:版本 / 断代 / 释读争议 · 出土流传 · 学者视角 →</div>
        </a>` : ''}
        <!-- Scholarly status -->
        <div class="dim-card" style="margin-bottom:16px;">
          <div class="dim-card-title">⑦ 学术地位</div>
          <div style="font-size:13px; line-height:1.7; color:var(--text-ink);">${data.scholarly_status}</div>
        </div>

        <!-- Provenance timeline -->
        <div class="dim-card" style="margin-bottom:16px;">
          <div class="dim-card-title">⑧ 流传年表</div>
          <div style="position:relative; padding-left:16px; border-left:2px solid var(--border-light);">
            ${data.provenance_timeline.map((ev, i) => `
              <div style="margin-bottom:12px; position:relative;">
                <div style="position:absolute; left:-21px; top:4px; width:8px; height:8px; border-radius:50%; background:${i===0?'var(--accent-red)':'var(--border-medium)'};"></div>
                <div style="font-size:11px; color:var(--accent-bronze); font-weight:600;">${ev.year} 年</div>
                <div style="font-size:12px; color:var(--text-ink);">${ev.event}</div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Related artifacts -->
        <div class="dim-card" style="margin-bottom:16px;">
          <div class="dim-card-title">⑨ 相关器物</div>
          <div style="display:flex; flex-direction:column; gap:6px;">
            ${(data.related_artifacts||[]).map(rel => {
              const rid = typeof rel === 'string' ? rel : (rel.id || '');
              const rec = (window.MuseumData && window.MuseumData.get) ? window.MuseumData.get(rid) : null;
              const label = rec ? rec.name_zh : (typeof rel === 'string' ? rel : (rel.name_zh || rid));
              const relation = (rel && typeof rel === 'object' && rel.relation) ? rel.relation : '';
              return `
              <div style="padding:8px 10px; background:var(--surface-sunken); border-radius:var(--radius); cursor:pointer; display:flex; align-items:flex-start; gap:8px;" onclick="location.href='artifact.html?id=${encodeURIComponent(rid)}'">
                <span>🏺</span>
                <div><div style="font-weight:600; font-size:13px;">${label}</div>${relation?`<div style="font-size:11px; color:var(--ink-3); line-height:1.4;">${relation}</div>`:''}</div>
              </div>`;
            }).join('')}
          </div>
        </div>

        <!-- Data sources -->
        <div class="dim-card" style="margin-bottom:16px;">
          <div class="dim-card-title">⑩ 资料来源</div>
          <div style="display:flex; flex-direction:column; gap:4px;">
            ${(data.data_sources||[]).map(src => `
              <div style="font-size:11px; color:var(--text-muted); padding:4px 0; border-bottom:1px solid var(--border-light);">${src}</div>
            `).join('')}
          </div>
        </div>

        <!-- Caster link -->
        <div class="dim-card">
          <div class="dim-card-title">⑪ 铸主档案</div>
          <a href="caster-profile.html" style="display:flex; align-items:center; gap:8px; color:var(--accent-bronze); text-decoration:none; font-size:13px;">
            <span>👤</span> 查看相关铸主档案 →
          </a>
        </div>
      </div>
    </div>

    ${archive ? renderArchive(archive) : ''}
  </div>`;

  document.getElementById('artifact-content').innerHTML = html;
}

// ── Backend archive (后台档案) — versions / disputes / interpretations ──────
function renderArchive(a) {
  if (!a) return '';
  const esc = s => String(s==null?'':s);
  const blocks = [];

  // Name versions (名称/释读版本)
  if (Array.isArray(a.name_versions) && a.name_versions.length) {
    blocks.push(`
      <div style="margin-bottom:var(--space-5);">
        <h3 style="font-size:var(--text-h3); color:var(--bronze); margin-bottom:var(--space-3);">名称与版本之争</h3>
        <div style="display:flex; flex-direction:column; gap:var(--space-2);">
          ${a.name_versions.map(v => `
            <div style="padding:var(--space-3); background:var(--surface-sunken); border-radius:var(--radius); border-left:3px solid var(--bronze);">
              <span style="font-weight:600; font-size:var(--text-lg);">${esc(v.name)}</span>
              ${v.status?`<span class="chop chop-bronze" style="margin-left:8px;">${esc(v.status)}</span>`:''}
              ${v.rationale?`<div style="font-size:var(--text-sm); color:var(--ink-2); margin-top:4px;">${esc(v.rationale)}</div>`:''}
              ${v.advocates?`<div style="font-size:var(--text-xs); color:var(--ink-3); margin-top:2px;">主张:${esc(v.advocates)}</div>`:''}
            </div>`).join('')}
        </div>
      </div>`);
  }

  // Dating debate (断代之争)
  if (a.dating_debate && (a.dating_debate.consensus || (a.dating_debate.alternatives||[]).length)) {
    const d = a.dating_debate;
    blocks.push(`
      <div style="margin-bottom:var(--space-5);">
        <h3 style="font-size:var(--text-h3); color:var(--bronze); margin-bottom:var(--space-3);">断代之争</h3>
        ${d.consensus?`<p style="font-size:var(--text-sm); margin-bottom:var(--space-2);"><span class="persp-cn" style="padding:0 6px;border-radius:4px;">主流</span> ${esc(d.consensus)}</p>`:''}
        ${(d.alternatives||[]).map(alt => `<p style="font-size:var(--text-sm); color:var(--ink-2); margin-bottom:4px;">↔ ${esc(alt.view)}${alt.by?` <span style="color:var(--ink-3);">— ${esc(alt.by)}</span>`:''}${alt.basis?`<br><span style="color:var(--ink-3); font-size:var(--text-xs);">依据:${esc(alt.basis)}</span>`:''}</p>`).join('')}
      </div>`);
  }

  // Interpretation disputes (释读/解说分歧)
  if (Array.isArray(a.interpretation_disputes) && a.interpretation_disputes.length) {
    blocks.push(`
      <div style="margin-bottom:var(--space-5);">
        <h3 style="font-size:var(--text-h3); color:var(--bronze); margin-bottom:var(--space-3);">不同解说</h3>
        ${a.interpretation_disputes.map(disp => `
          <div style="margin-bottom:var(--space-3);">
            <div style="font-weight:600; font-size:var(--text-sm); margin-bottom:var(--space-1);">${esc(disp.topic)}</div>
            ${(disp.views||[]).map(v => `<div style="font-size:var(--text-sm); color:var(--ink-2); padding:4px 0 4px var(--space-3); border-left:2px solid var(--line-strong); margin-bottom:4px;">「${esc(v.reading||v.view)}」${v.by?` <span style="color:var(--ink-3);">— ${esc(v.by)}</span>`:''}${v.argument?`<br><span style="color:var(--ink-3); font-size:var(--text-xs);">${esc(v.argument)}</span>`:''}</div>`).join('')}
          </div>`).join('')}
      </div>`);
  }

  // Scholarly perspectives
  if (Array.isArray(a.scholarly_perspectives) && a.scholarly_perspectives.length) {
    blocks.push(`
      <div style="margin-bottom:var(--space-5);">
        <h3 style="font-size:var(--text-h3); color:var(--bronze); margin-bottom:var(--space-3);">学者视角</h3>
        <div style="display:flex; flex-direction:column; gap:var(--space-2);">
          ${a.scholarly_perspectives.map(s => `<div style="font-size:var(--text-sm);"><strong>${esc(s.scholar)}</strong>${s.school?` <span class="chop chop-patina" style="font-size:var(--text-2xs);">${esc(s.school)}</span>`:''}:${esc(s.position)}</div>`).join('')}
        </div>
      </div>`);
  }

  // Discovery story / controversies
  if (a.discovery_story && (a.discovery_story.official || (a.discovery_story.controversies||[]).length || (a.discovery_story.rumors_vs_fact||[]).length)) {
    const ds = a.discovery_story;
    blocks.push(`
      <div style="margin-bottom:var(--space-5);">
        <h3 style="font-size:var(--text-h3); color:var(--bronze); margin-bottom:var(--space-3);">出土/流传考</h3>
        ${ds.official?`<p style="font-size:var(--text-sm); margin-bottom:var(--space-2);">${esc(ds.official)}</p>`:''}
        ${(ds.controversies||[]).map(c=>`<p style="font-size:var(--text-sm); color:var(--ink-2);">· ${esc(c)}</p>`).join('')}
        ${(ds.rumors_vs_fact||[]).map(rf=>`<p style="font-size:var(--text-sm); color:var(--ink-2); margin-top:4px;"><span class="persp-folk" style="padding:0 6px;border-radius:4px;">传说</span> ${esc(rf.rumor)} <span class="persp-cn" style="padding:0 6px;border-radius:4px;">考</span> ${esc(rf.fact)}</p>`).join('')}
      </div>`);
  }

  // Extended narrative
  if (a.extended_narrative) {
    blocks.push(`<div style="margin-bottom:var(--space-5);"><h3 style="font-size:var(--text-h3); color:var(--bronze); margin-bottom:var(--space-3);">深度背景</h3><p style="font-size:var(--text-sm); line-height:var(--lh-normal); color:var(--ink);">${esc(a.extended_narrative)}</p></div>`);
  }

  // Sources
  if (Array.isArray(a.sources) && a.sources.length) {
    blocks.push(`<div><h3 style="font-size:var(--text-h3); color:var(--bronze); margin-bottom:var(--space-3);">考据来源</h3>${a.sources.map(s=>`<div style="font-size:var(--text-xs); color:var(--ink-3); padding:3px 0; border-bottom:1px solid var(--line);">${esc(s.author)}${s.year?` (${esc(s.year)})`:''} 《${esc(s.title)}》</div>`).join('')}</div>`);
  }

  if (!blocks.length) return '';
  return `
    <section class="section" style="margin-top:var(--space-6);">
      <div class="dim-card" style="border-top:3px solid var(--cinnabar);">
        <div style="display:flex; align-items:center; gap:var(--space-2); margin-bottom:var(--space-4);">
          <h2 style="font-size:var(--text-h2); color:var(--ink);">⑫ 后台档案 · 争议与考据</h2>
          <span class="chop chop-cinnabar">不同版本 · 不同解说</span>
        </div>
        ${blocks.join('')}
      </div>
    </section>`;
}

function switchView(mode) {
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === (mode==='实景'?'实景':'线稿')));
  const img = document.getElementById('artifact-img');
  if (!img) return;
  const photoUrl = img.dataset.photoUrl;
  const silhouetteUrl = img.dataset.silhouetteUrl;
  if (mode === 'photo' && photoUrl) {
    img.src = photoUrl;
    img.className = 'photo-img';
    img.style.filter = 'none';
    img.style.opacity = '1';
  } else {
    img.src = silhouetteUrl;
    img.className = 'silhouette-img';
    img.style.filter = 'invert(1)';
    img.style.opacity = '0.8';
  }
}

function toggleCollect(id) {
  if (window.CollectionState) {
    const now = window.CollectionState.isCollected(id);
    if (!now) {
      window.CollectionState.collect(id, { dynasty: '商' });
    }
  }
  const btn = document.getElementById('collect-btn');
  if (btn) {
    btn.style.background = 'var(--accent-bronze)';
    btn.style.color = 'white';
    btn.textContent = '✓ 已收藏';
  }
}

function highlightPattern(pattern) {
  if (window.CrossDimWiring) {
    document.dispatchEvent(new CustomEvent('pattern-focus', { detail: { pattern, triggered_by: 'artifact.pattern' } }));
  }
}

// Load artifact based on URL param
const params = new URLSearchParams(location.search);
const artifactId = params.get('id') || 'houmuwu_ding';

function renderNotFound() {
  document.getElementById('artifact-content').innerHTML =
    `<div style="text-align:center; padding:80px 24px; color:var(--text-muted);">
      <h2 style="color:var(--text-ink); font-size:28px; margin-bottom:12px;">未找到该文物</h2>
      <p style="font-size:14px; margin-bottom:8px;">artifactId: <code style="background:#f4ece0; padding:2px 8px; border-radius:4px;">${artifactId}</code></p>
      <p style="font-size:13px; margin-bottom:20px;">可能是 URL 拼写错误,或该 ID 不在 277 件数据集中。</p>
      <a href="catalog.html" style="display:inline-block; padding:10px 24px; background:var(--accent-bronze); color:white; border-radius:6px; text-decoration:none;">← 返回图鉴</a>
    </div>`;
}

function tryRender() {
  if (!(window.MuseumData && window.MuseumData.artifacts && window.MuseumData.artifacts.length > 0)) return false;
  const raw = window.MuseumData.get(artifactId);
  if (!raw) {
    renderNotFound();
    return true;
  }
  const data = normalizeRecord(raw);
  renderArtifact(data);
  document.title = `${data.name_zh} — MuseumCollect v3`;
  setTimeout(() => {
    if (window.CrossDimWiring) window.CrossDimWiring.emitEra(data.dynasty, 'artifact.load');
  }, 500);
  return true;
}

// Backend archive (后台档案): fetch once, then (re-)render so the 争议/解说
// section appears. Graceful no-op if the file is absent.
window.ARTIFACT_ARCHIVES = window.ARTIFACT_ARCHIVES || {};
fetch('../../data/curated/artifact-archives.json')
  .then(r => r.ok ? r.json() : {})
  .then(a => { window.ARTIFACT_ARCHIVES = a || {}; tryRender(); })
  .catch(() => {});

// Which artifacts have a full wiki deep-archive (wiki.html?entry=<id>)
window.WIKI_ARTIFACT_SLUGS = window.WIKI_ARTIFACT_SLUGS || new Set();
fetch('../../wiki/index.json')
  .then(r => r.ok ? r.json() : null)
  .then(idx => { if (idx && idx.entries) { window.WIKI_ARTIFACT_SLUGS = new Set(idx.entries.filter(e => e.category === '文物').map(e => e.slug)); tryRender(); } })
  .catch(() => {});

// Render now if data already loaded, otherwise wait for the ready event
if (!tryRender()) {
  document.addEventListener('museum-data-ready', tryRender);
}
</script>
</body>
</html>
