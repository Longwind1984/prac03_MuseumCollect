<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>国宝 · 独白</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/immersive.css" />
</head>
<body>

  <!-- ====== HERO ZONE — one full-screen immersive sceneof the artifact ====== -->
  <section id="hero" class="relative min-h-screen flex items-end pb-20"
           style="padding-top: 80px;">
    <div class="absolute inset-0 overflow-hidden">
      <div id="heroImg" class="absolute inset-0 ken-burns"></div>
      <div class="absolute inset-0" style="background:
        linear-gradient(180deg, rgba(13,12,10,0.4) 0%, rgba(13,12,10,0.2) 40%, var(--ink-black) 92%),
        linear-gradient(90deg, rgba(13,12,10,0.65) 0%, transparent 35%, transparent 65%, rgba(13,12,10,0.65) 100%);"></div>
      <!-- Wisps -->
      <div class="wisp" style="left: 55%; bottom: 30%;"></div>
      <div class="wisp" style="left: 60%; bottom: 25%; animation-delay: 4s;"></div>
    </div>

    <div class="relative z-10 px-20 max-w-5xl scene-enter">
      <div id="heroPoem" class="poem-line mb-6" style="font-size: 18px; letter-spacing: 0.2em;"></div>
      <h1 id="heroName" class="calligraphy-title" style="font-size: 4rem;"></h1>
      <div id="heroMeta" class="mt-6 flex items-center gap-5" style="color: var(--silk-warm); letter-spacing: 0.25em; font-size: 13px;"></div>
      <div id="heroSeals" class="mt-8 flex flex-wrap gap-3"></div>
    </div>
  </section>

  <!-- ====== 国宝独白 — Monologue ====== -->
  <section class="px-20 py-32 relative" style="background: var(--ink-black);">
    <div class="max-w-3xl mx-auto">
      <div class="text-center mb-12">
        <div class="poem-line" style="font-size: 13px; letter-spacing: 0.5em; opacity: 0.6;">
          — 国 宝 · 独 白 —
        </div>
        <div class="brush-divider mt-6" style="width: 80px; margin: 24px auto;"></div>
        <p style="font-family: var(--font-kai); font-style: italic; color: var(--silk-warm); font-size: 14px; letter-spacing: 0.15em;">
          闭上眼睛,听它说。
        </p>
      </div>

      <!-- Audio player UI placeholder -->
      <div class="aged-panel mb-12 p-6 flex items-center gap-6 relative paper-grain">
        <button id="playBtn" class="flex items-center justify-center"
                style="width: 56px; height: 56px; border: 1px solid var(--gold-soft); border-radius: 50%; background: rgba(212,168,87,0.08); cursor: pointer; transition: all 0.5s ease;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: var(--gold-treasure);">
            <polygon points="6,4 20,12 6,20" fill="currentColor"/>
          </svg>
        </button>
        <div class="flex-1">
          <div style="font-family: var(--font-kai); color: var(--silk-cream); font-size: 15px; letter-spacing: 0.1em;">
            朗诵 · 古汉语模拟 + 现代汉语
          </div>
          <div style="color: var(--bronze-mid); font-size: 11px; letter-spacing: 0.3em; margin-top: 4px;">
            00:00 / 02:38 · MOCK AUDIO PLACEHOLDER
          </div>
          <!-- Sound wave placeholder -->
          <svg viewBox="0 0 200 24" class="mt-2" style="width: 100%; height: 18px;">
            <g style="opacity: 0.5;">
              ${Array.from({length: 50}).map((_,i) => `<rect x="${i*4}" y="${10 - 5*Math.abs(Math.sin(i*0.3))}" width="2" height="${10*Math.abs(Math.sin(i*0.3))+2}" fill="#d4a857"/>`).join('')}
            </g>
          </svg>
        </div>
        <div style="font-family: var(--font-kai); color: var(--gold-soft); font-size: 12px; letter-spacing: 0.2em;">
          铭文之声
        </div>
      </div>

      <!-- Monologue text — drop-cap, generous line height, no images -->
      <div id="monologue" class="monologue drop-cap"></div>
    </div>
  </section>

  <!-- ====== 场景重建 — Scene reconstruction (cinematic) ====== -->
  <section class="relative" style="background: var(--ink-dark); min-height: 90vh;">
    <div class="max-w-6xl mx-auto px-20 py-32">
      <div class="text-center mb-12">
        <div class="poem-line" style="font-size: 13px; letter-spacing: 0.5em; opacity: 0.6;">
          — 场 · 景 —
        </div>
        <h2 class="calligraphy-title mt-4" style="font-size: 2.5rem;">把它放回当年的那一刻</h2>
      </div>

      <div id="sceneVisual" class="aged-panel relative overflow-hidden paper-grain"
           style="aspect-ratio: 16/8;">
        <!-- filled by JS -->
      </div>

      <div id="sceneNarration" class="mt-10 monologue" style="font-size: 17px; max-width: 720px; margin-left: auto; margin-right: auto; text-align: center; font-style: italic;"></div>
    </div>
  </section>

  <!-- ====== 五段时光长卷 — 出生 → 使用 → 埋葬 → 重见天日 → 入馆 ====== -->
  <section class="px-20 py-32" style="background: var(--ink-black);">
    <div class="max-w-6xl mx-auto">
      <div class="text-center mb-16">
        <div class="poem-line" style="font-size: 13px; letter-spacing: 0.5em; opacity: 0.6;">
          — 时 · 光 · 卷 —
        </div>
        <h2 class="calligraphy-title mt-4" style="font-size: 2.5rem;">它经历了什么</h2>
      </div>
      <div id="lifeScroll" class="grid grid-cols-5 gap-4 fade-up"></div>
    </div>
  </section>

  <!-- ====== 工艺长卷 — Craft scroll (horizontal) ====== -->
  <section class="px-20 py-32" style="background: var(--ink-dark);">
    <div class="max-w-6xl mx-auto">
      <div class="text-center mb-12">
        <div class="poem-line" style="font-size: 13px; letter-spacing: 0.5em; opacity: 0.6;">
          — 工 · 艺 · 长 · 卷 —
        </div>
        <h2 class="calligraphy-title mt-4" style="font-size: 2.5rem;">怎么造出来的</h2>
        <p class="mt-3 poem-line" style="font-size: 14px; opacity: 0.7;">商代铸鼎,工匠百人,半年方成</p>
      </div>

      <div id="craftScroll" class="flex gap-2 overflow-x-auto scroll-snap-x py-8" style="scroll-padding-left: 80px;"></div>
    </div>
  </section>

  <!-- ====== 铭文 — Inscription as 国宝独白·细读 ====== -->
  <section id="inscriptionSection" class="px-20 py-32" style="background: var(--ink-black); display: none;">
    <div class="max-w-4xl mx-auto">
      <div class="text-center mb-12">
        <div class="poem-line" style="font-size: 13px; letter-spacing: 0.5em; opacity: 0.6;">
          — 铭 · 文 · 之 · 声 —
        </div>
        <h2 class="calligraphy-title mt-4" style="font-size: 2.5rem;">它腹中刻了什么</h2>
      </div>

      <div class="aged-panel paper-grain p-12 relative">
        <div id="inscriptionText" class="text-center" style="font-family: var(--font-kai); font-size: 28px; line-height: 2.4; letter-spacing: 0.3em; color: var(--gold-treasure);"></div>
        <div class="brush-divider my-8"></div>
        <div id="inscriptionMeaning" class="monologue" style="font-size: 16px;"></div>
        <div class="text-right mt-8">
          <span class="seal">铭文之声</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ====== Action — "迎回我的青铜旅" ====== -->
  <section class="px-20 py-32 text-center" style="background: var(--ink-dark);">
    <div id="collectArea" class="max-w-2xl mx-auto"></div>
  </section>

  <!-- ====== 同行国宝 — Recommendations as poetic companions ====== -->
  <section class="px-20 py-32" style="background: var(--ink-black);">
    <div class="max-w-6xl mx-auto">
      <div class="text-center mb-12">
        <div class="poem-line" style="font-size: 13px; letter-spacing: 0.5em; opacity: 0.6;">
          — 同 · 行 —
        </div>
        <h2 class="calligraphy-title mt-4" style="font-size: 2rem;">和它一起的,还有</h2>
      </div>
      <div id="related" class="grid grid-cols-3 gap-10 fade-up"></div>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (async function () {
      MCUI.renderHeader('catalog');
      MCUI.renderFooter();

      await MCData.ready;

      // ----- Parse ?id -----
      const params = new URLSearchParams(location.search);
      const id = params.get('id') || 'houmuwu_ding';
      const artifact = MCData.catalog.find(a => a.id === id) || MCData.catalog[0];
      const mono = MCData.getMonologue(artifact.id);

      // ----- Hero -----
      document.getElementById('heroImg').innerHTML = MCUI.imageOrPlaceholder(artifact, { cls: 'lg w-full h-full', style: 'width:100%; height:100%;' });
      document.getElementById('heroPoem').textContent = mono.poem || `${artifact.dynasty} · ${artifact.period}`;
      document.getElementById('heroName').textContent = artifact.name_zh;
      const sz = artifact.size || {};
      const sizeStr = [
        sz.height_cm ? `高 ${sz.height_cm} cm` : null,
        sz.weight_kg ? `重 ${sz.weight_kg} kg` : null,
      ].filter(Boolean).join(' · ');
      document.getElementById('heroMeta').innerHTML = `
        <span>${artifact.dynasty} · ${artifact.period || ''}</span>
        <span style="color: var(--gold-soft);">|</span>
        <span>${artifact.current_museum}</span>
        ${sizeStr ? `<span style="color: var(--gold-soft);">|</span><span>${sizeStr}</span>` : ''}
      `;

      // Seals (rarity + tags)
      const seals = [];
      if (MCData.isForbiddenExport(artifact)) seals.push({ text: '禁 止 出 境', color: 'var(--vermilion-seal)' });
      if (MCData.isTreasure(artifact)) seals.push({ text: '国 之 重 器', color: 'var(--vermilion-seal)' });
      if (artifact.inscription && artifact.inscription.char_count >= 100) seals.push({ text: '长 铭', color: '#4a6b4a' });
      if ((artifact.ancient_state || '').includes('蜀')) seals.push({ text: '古 蜀', color: '#8b3a2a' });
      if ((artifact.current_museum || '').includes('台北')) seals.push({ text: '海 峡 之 外', color: '#a06a4a' });
      document.getElementById('heroSeals').innerHTML = seals.map(s =>
        `<span class="seal" style="background: ${s.color};">${s.text}</span>`
      ).join('');

      // ----- Monologue -----
      document.getElementById('monologue').innerHTML = (mono.voice || artifact.story_brief || '').split('\n').map(line => line.trim() ? `<p>${line}</p>` : '').join('');

      // ----- Scene reconstruction — render based on purpose -----
      const purpose = (artifact.purpose || '').toLowerCase();
      const isRitual = purpose.includes('祭祀');
      const isMusic = (artifact.type || '').includes('乐器');
      const isWeapon = (artifact.type || '').includes('兵器');
      const isLamp = (artifact.type || '').includes('灯');

      let sceneSvg = '';
      let narration = '';

      if (isRitual) {
        sceneSvg = `
          <svg viewBox="0 0 800 320" class="w-full h-full">
            <defs>
              <radialGradient id="flameGlow" cx="50%" cy="50%">
                <stop offset="0%" stop-color="#d4a857" stop-opacity="0.9"/>
                <stop offset="40%" stop-color="#b91c1c" stop-opacity="0.4"/>
                <stop offset="100%" stop-color="transparent"/>
              </radialGradient>
              <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#1a1614"/>
                <stop offset="100%" stop-color="#0d0a08"/>
              </linearGradient>
            </defs>

            <!-- Sky -->
            <rect x="0" y="0" width="800" height="180" fill="#0d0c0a"/>
            <!-- Faded moon -->
            <circle cx="650" cy="60" r="22" fill="#d4a857" opacity="0.15"/>

            <!-- Ancient temple roof line -->
            <path d="M50,160 L150,110 L350,90 L450,90 L650,110 L750,160" stroke="#8b6f3d" stroke-width="2" fill="none" opacity="0.5"/>
            <path d="M50,160 L750,160 L750,180 L50,180 Z" fill="#3a2a1a" opacity="0.7"/>

            <!-- Pillars -->
            <rect x="120" y="170" width="6" height="100" fill="#6d4a2a" opacity="0.7"/>
            <rect x="280" y="170" width="6" height="100" fill="#6d4a2a" opacity="0.7"/>
            <rect x="520" y="170" width="6" height="100" fill="#6d4a2a" opacity="0.7"/>
            <rect x="680" y="170" width="6" height="100" fill="#6d4a2a" opacity="0.7"/>

            <!-- Ground -->
            <rect x="0" y="270" width="800" height="50" fill="url(#ground)"/>

            <!-- Altar -->
            <rect x="320" y="220" width="160" height="50" fill="#4a3a24" stroke="#8b6f3d" stroke-width="1.5"/>
            <rect x="340" y="200" width="120" height="20" fill="#6d4a2a" stroke="#8b6f3d" stroke-width="1"/>

            <!-- Center ding (representing the artifact) -->
            <g transform="translate(400, 200)">
              <ellipse cx="0" cy="-20" rx="36" ry="10" fill="none" stroke="#d4a857" stroke-width="2"/>
              <path d="M-32,-20 Q-36,10 -30,30 L30,30 Q36,10 32,-20 Z" fill="#4a3a24" stroke="#d4a857" stroke-width="2"/>
              <rect x="-28" y="30" width="6" height="20" fill="#4a3a24" stroke="#d4a857" stroke-width="1"/>
              <rect x="22" y="30" width="6" height="20" fill="#4a3a24" stroke="#d4a857" stroke-width="1"/>
              <rect x="-3" y="30" width="6" height="20" fill="#4a3a24" stroke="#d4a857" stroke-width="1"/>
              <!-- glow -->
              <circle r="60" fill="url(#flameGlow)" opacity="0.7"/>
            </g>

            <!-- Two flame tripods left and right -->
            <g transform="translate(150, 240)">
              <ellipse rx="32" ry="10" fill="url(#flameGlow)" opacity="0.8"/>
              <path d="M-2,-5 Q-6,-30 0,-50 Q4,-30 2,-5 Z" fill="#d4a857" opacity="0.7">
                <animate attributeName="d" dur="3s" repeatCount="indefinite"
                  values="M-2,-5 Q-6,-30 0,-50 Q4,-30 2,-5 Z;
                          M-2,-5 Q-8,-32 0,-46 Q6,-30 2,-5 Z;
                          M-2,-5 Q-6,-30 0,-50 Q4,-30 2,-5 Z"/>
              </path>
            </g>
            <g transform="translate(650, 240)">
              <ellipse rx="32" ry="10" fill="url(#flameGlow)" opacity="0.8"/>
              <path d="M-2,-5 Q-6,-30 0,-50 Q4,-30 2,-5 Z" fill="#d4a857" opacity="0.7">
                <animate attributeName="d" dur="3.6s" repeatCount="indefinite"
                  values="M-2,-5 Q-6,-30 0,-50 Q4,-30 2,-5 Z;
                          M-2,-5 Q-4,-26 0,-48 Q8,-30 2,-5 Z;
                          M-2,-5 Q-6,-30 0,-50 Q4,-30 2,-5 Z"/>
              </path>
            </g>

            <!-- Priest silhouettes -->
            <g transform="translate(220, 270)">
              <path d="M-8,0 Q-10,-22 0,-30 Q10,-22 8,0 Z" fill="#0d0c0a" stroke="#8b6f3d" stroke-width="0.5"/>
              <circle cx="0" cy="-36" r="5" fill="#0d0c0a" stroke="#8b6f3d" stroke-width="0.5"/>
            </g>
            <g transform="translate(580, 270)">
              <path d="M-8,0 Q-10,-22 0,-30 Q10,-22 8,0 Z" fill="#0d0c0a" stroke="#8b6f3d" stroke-width="0.5"/>
              <circle cx="0" cy="-36" r="5" fill="#0d0c0a" stroke="#8b6f3d" stroke-width="0.5"/>
            </g>

            <!-- "神主" calligraphy at top center -->
            <text x="400" y="120" text-anchor="middle" fill="#d4a857" font-family="serif" font-size="24" font-style="italic" opacity="0.85" letter-spacing="6">神 主</text>
          </svg>
        `;
        narration = `灯火明灭。三千年前商王朝的祭祀大殿,火光在它身上跳动,远处编钟开始响——它的存在,是要让神看见。`;
      } else if (isMusic) {
        sceneSvg = `
          <svg viewBox="0 0 800 320" class="w-full h-full">
            <defs>
              <linearGradient id="hallBg" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#1a1614"/>
                <stop offset="100%" stop-color="#0d0a08"/>
              </linearGradient>
            </defs>
            <rect x="0" y="0" width="800" height="320" fill="url(#hallBg)"/>
            <!-- Hall pillars receding -->
            <path d="M50,100 L70,300 L100,300 L80,100 Z" fill="#3a2a1a"/>
            <path d="M730,100 L710,300 L740,300 L750,100 Z" fill="#3a2a1a"/>
            <!-- Bell rack -->
            <line x1="180" y1="100" x2="620" y2="100" stroke="#8b6f3d" stroke-width="3"/>
            <line x1="180" y1="160" x2="620" y2="160" stroke="#8b6f3d" stroke-width="3"/>
            <line x1="180" y1="220" x2="620" y2="220" stroke="#8b6f3d" stroke-width="3"/>
            <!-- Bells (top row, large bells) -->
            ${Array.from({length: 10}).map((_, i) => {
              const x = 200 + i * 44;
              const w = 30 - i * 1.5;
              const h = 50;
              return `<path d="M${x-w/2},100 L${x-w/2-2},${100+h} Q${x},${100+h+6} ${x+w/2+2},${100+h} L${x+w/2},100 Z" fill="#4a3a24" stroke="#d4a857" stroke-width="0.6" opacity="0.85"/>`;
            }).join('')}
            <!-- Mid row -->
            ${Array.from({length: 13}).map((_, i) => {
              const x = 195 + i * 33;
              const w = 22 - i * 0.8;
              const h = 38;
              return `<path d="M${x-w/2},160 L${x-w/2-1},${160+h} Q${x},${160+h+4} ${x+w/2+1},${160+h} L${x+w/2},160 Z" fill="#4a3a24" stroke="#d4a857" stroke-width="0.4" opacity="0.8"/>`;
            }).join('')}
            <!-- Bottom row (small) -->
            ${Array.from({length: 16}).map((_, i) => {
              const x = 195 + i * 27;
              const w = 16;
              const h = 28;
              return `<path d="M${x-w/2},220 L${x-w/2-1},${220+h} Q${x},${220+h+3} ${x+w/2+1},${220+h} L${x+w/2},220 Z" fill="#4a3a24" stroke="#d4a857" stroke-width="0.3" opacity="0.75"/>`;
            }).join('')}
            <!-- Subtle musician silhouette -->
            <g transform="translate(400, 290)" opacity="0.6">
              <ellipse cx="0" cy="0" rx="14" ry="3" fill="#0d0c0a"/>
              <path d="M-8,0 Q-10,-22 0,-30 Q10,-22 8,0 Z" fill="#1a1614" stroke="#8b6f3d" stroke-width="0.5"/>
            </g>
            <!-- Glow notes -->
            <text x="400" y="60" text-anchor="middle" fill="#d4a857" font-family="serif" font-size="22" font-style="italic" opacity="0.75" letter-spacing="10">钟 鼓 既 设</text>
          </svg>
        `;
        narration = `公元前五世纪,曾国的宴会上。六十五件钟一齐响起,十二律俱全——这是世界上最早的乐律。`;
      } else if (isWeapon) {
        sceneSvg = `
          <svg viewBox="0 0 800 320" class="w-full h-full">
            <defs>
              <radialGradient id="moonGlow" cx="50%" cy="50%">
                <stop offset="0%" stop-color="#d4a857" stop-opacity="0.4"/>
                <stop offset="100%" stop-color="transparent"/>
              </radialGradient>
            </defs>
            <rect x="0" y="0" width="800" height="320" fill="#0d0c0a"/>
            <!-- Moon -->
            <circle cx="600" cy="80" r="40" fill="url(#moonGlow)"/>
            <circle cx="600" cy="80" r="18" fill="#d4a857" opacity="0.5"/>
            <!-- Mountain silhouettes -->
            <path d="M0,260 L150,160 L260,210 L350,140 L500,200 L600,170 L800,240 L800,320 L0,320 Z" fill="#1a1614"/>
            <path d="M0,290 L200,220 L350,260 L500,230 L700,280 L800,260 L800,320 L0,320 Z" fill="#0d0a08"/>
            <!-- Sword -->
            <g transform="translate(400, 220) rotate(-25)">
              <rect x="-2" y="-100" width="4" height="120" fill="#d4a857"/>
              <rect x="-12" y="0" width="24" height="6" fill="#8b6f3d"/>
              <rect x="-3" y="6" width="6" height="40" fill="#6d4a2a"/>
              <circle cx="0" cy="50" r="6" fill="#8b6f3d"/>
              <!-- glint -->
              <line x1="0" y1="-100" x2="0" y2="-50" stroke="#fff" stroke-width="0.5" opacity="0.7"/>
            </g>
            <text x="400" y="50" text-anchor="middle" fill="#d4a857" font-family="serif" font-size="22" font-style="italic" opacity="0.85" letter-spacing="10">卧 薪 尝 胆</text>
          </svg>
        `;
        narration = `两千四百年前,越王勾践把这把剑佩在腰间。它的剑光至今未灭,出土时仍能割断试纸。`;
      } else if (isLamp) {
        sceneSvg = `
          <svg viewBox="0 0 800 320" class="w-full h-full">
            <rect x="0" y="0" width="800" height="320" fill="#0d0c0a"/>
            <!-- Palace window outline -->
            <rect x="200" y="40" width="400" height="220" fill="none" stroke="#3a2a1a" stroke-width="3"/>
            <line x1="400" y1="40" x2="400" y2="260" stroke="#3a2a1a" stroke-width="1.5"/>
            <!-- Lamp shape -->
            <g transform="translate(400, 220)">
              <ellipse cx="0" cy="0" rx="50" ry="14" fill="#3a2a1a"/>
              <path d="M-30,0 Q-32,-30 0,-50 Q32,-30 30,0 Z" fill="#4a3a24" stroke="#d4a857" stroke-width="1.5"/>
              <circle cx="0" cy="-60" r="18" fill="#d4a857" opacity="0.85">
                <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
              </circle>
              <circle cx="0" cy="-60" r="40" fill="#d4a857" opacity="0.15">
                <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3s" repeatCount="indefinite"/>
              </circle>
            </g>
            <text x="400" y="295" text-anchor="middle" fill="#d4a857" font-family="serif" font-size="20" font-style="italic" opacity="0.75" letter-spacing="10">宫 灯 一 点</text>
          </svg>
        `;
        narration = `两千两百年前长信宫的夜里,这盏灯亮着。它的导烟管,让室内的空气始终干净。`;
      } else {
        // Default: forge / casting scene
        sceneSvg = `
          <svg viewBox="0 0 800 320" class="w-full h-full">
            <defs>
              <radialGradient id="forge" cx="50%" cy="50%">
                <stop offset="0%" stop-color="#d4a857"/>
                <stop offset="40%" stop-color="#b91c1c"/>
                <stop offset="100%" stop-color="transparent"/>
              </radialGradient>
            </defs>
            <rect x="0" y="0" width="800" height="320" fill="#0d0c0a"/>
            <!-- The artifact silhouette center -->
            <g transform="translate(400, 200)">
              <circle r="60" fill="url(#forge)" opacity="0.7"/>
              <path d="M-30,-40 Q-36,0 -30,30 L30,30 Q36,0 30,-40 Z" fill="#4a3a24" stroke="#d4a857" stroke-width="2"/>
            </g>
            <text x="400" y="270" text-anchor="middle" fill="#d4a857" font-family="serif" font-size="22" font-style="italic" opacity="0.75" letter-spacing="10">三 千 年 前 的 火 光</text>
          </svg>
        `;
        narration = `工匠的火光照在它身上。这是它出生的那一刻。`;
      }

      document.getElementById('sceneVisual').innerHTML = sceneSvg;
      document.getElementById('sceneNarration').textContent = narration;

      // ----- Life scroll (5 chapters) -----
      const lifeSegments = [
        { title: '出 生', poem: artifact.approx_year || '三千年前', desc: `工匠用 ${artifact.craft} 把它铸出来。` },
        { title: '使 用', poem: '当年使用', desc: `${artifact.purpose || '礼器'} · 它属于这个用途。` },
        { title: '埋 葬', poem: '埋藏地下', desc: '它陪一个人去到另一个世界,或被慎重收藏入窖。' },
        { title: '重 见', poem: artifact.excavation_year ? `${artifact.excavation_year} 年` : '后世挖出', desc: `在 ${artifact.excavation_site || '某地'} 重新被打开。` },
        { title: '入 馆', poem: artifact.current_museum, desc: '此刻它在这里。你也在这里。' },
      ];
      document.getElementById('lifeScroll').innerHTML = lifeSegments.map((s, i) => `
        <div class="text-center relative">
          <div style="width: 100%; height: 80px; border: 1px solid rgba(212,168,87,0.3); position: relative; display: flex; align-items: center; justify-content: center;
                      background: linear-gradient(135deg, rgba(74,58,36,0.3), rgba(13,12,10,0.6));">
            <div class="poem-line" style="font-size: 11px; opacity: 0.6;">第 ${'壹贰叁肆伍'[i]} 章</div>
          </div>
          <h4 class="calligraphy-title mt-4" style="font-size: 1.3rem; color: var(--gold-treasure);">${s.title}</h4>
          <div class="poem-line mt-2" style="font-size: 11px; opacity: 0.7;">${s.poem}</div>
          <p class="mt-3" style="font-family: var(--font-serif); font-size: 13px; line-height: 1.9; color: var(--silk-warm); opacity: 0.85; letter-spacing: 0.05em;">${s.desc}</p>
        </div>
      `).join('');

      // ----- Craft scroll -----
      let craftSteps = [];
      const craft = (artifact.craft || '范铸法').toLowerCase();
      if (craft.includes('失蜡')) {
        craftSteps = ['制 蜡 模', '外 裹 耐 火 泥', '加 热 失 蜡', '浇 铸 铜 液', '敲 掉 外 泥', '修 整 成 器'];
      } else if (craft.includes('错金')) {
        craftSteps = ['铸 器 身', '錾 出 沟 槽', '镶 入 金 丝', '锤 平 打 磨', '抛 光 显 纹', '成 器'];
      } else {
        craftSteps = ['制 泥 模', '翻 外 范', '制 内 范', '合 范 浇 铸', '熔 铜 一 二〇〇°C', '脱 范', '打 磨', '入 庙'];
      }
      document.getElementById('craftScroll').innerHTML = craftSteps.map((step, i) => `
        <div class="scroll-snap-item flex-shrink-0 aged-panel paper-grain relative" style="width: 200px; aspect-ratio: 3/4;">
          <div class="absolute top-3 left-3" style="font-family: var(--font-kai); color: var(--gold-soft); font-size: 14px; letter-spacing: 0.2em;">第 ${'一二三四五六七八'[i]} 工</div>
          <div class="absolute inset-0 flex items-center justify-center">
            <svg viewBox="0 0 80 80" width="60" height="60">
              <circle cx="40" cy="40" r="30" fill="none" stroke="#d4a857" stroke-width="0.5" opacity="0.4"/>
              <text x="40" y="46" text-anchor="middle" fill="#d4a857" font-family="serif" font-size="11" opacity="0.7">${i+1}</text>
            </svg>
          </div>
          <div class="absolute bottom-4 left-0 right-0 text-center calligraphy-title" style="font-size: 1.1rem; color: var(--silk-cream); letter-spacing: 0.3em;">${step}</div>
        </div>
      `).join('');

      // ----- Inscription (if has) -----
      if (artifact.inscription && artifact.inscription.has) {
        document.getElementById('inscriptionSection').style.display = 'block';
        const text = artifact.inscription.text;
        document.getElementById('inscriptionText').textContent = text ? text.split('').join(' ') : `${artifact.inscription.char_count} 字`;
        document.getElementById('inscriptionMeaning').innerHTML = `<p>${artifact.inscription.summary}</p>`;
      }

      // ----- Collect action -----
      const collected = MCData.isCollected(artifact.id);
      document.getElementById('collectArea').innerHTML = `
        <div class="poem-line mb-6" style="font-size: 13px; letter-spacing: 0.5em; opacity: 0.7;">— 把 它 收 进 你 的 长 卷 —</div>
        <h3 class="calligraphy-title mb-4" style="font-size: 2rem;">
          ${collected ? '它 已 在 你 心 中' : '迎 它 进 来'}
        </h3>
        <p class="poem-line mb-10" style="font-size: 15px; opacity: 0.8;">
          ${collected ? '你已听过它的话,它会在你长卷里。' : '听过它的话,你的旅程会多走一段。'}
        </p>
        ${collected
          ? `<a href="me.html" class="btn-bronze">看 你 的 长 卷 →</a>`
          : `<button class="btn-gold" onclick="window.alert('已加入你的青铜之旅 —— 三千年的故事,从这一件开始。')">加 入 我 的 青 铜 之 旅</button>`}
      `;

      // ----- Related (same dynasty / same form / same site) -----
      const related = MCData.catalog.filter(a => a.id !== artifact.id)
        .map(a => {
          let score = 0;
          if (a.dynasty === artifact.dynasty) score += 2;
          if (a.form_subtype === artifact.form_subtype) score += 3;
          if (MCData.siteKeyFor(a) === MCData.siteKeyFor(artifact)) score += 2;
          if ((a.patterns || []).some(p => (artifact.patterns || []).includes(p))) score += 1;
          return { a, score };
        })
        .filter(x => x.score > 0)
        .sort((x, y) => y.score - x.score)
        .slice(0, 3)
        .map(x => x.a);

      document.getElementById('related').innerHTML = related.map(a => {
        const m = MCData.getMonologue(a.id);
        return `
          <a href="artifact.html?id=${a.id}" class="block group">
            <div class="${MCData.isTreasure(a) ? 'halo-treasure' : ''} ${MCData.isCollected(a.id) ? '' : 'sleeping'}" style="aspect-ratio: 3/4; overflow: hidden; position: relative;">
              ${MCUI.imageOrPlaceholder(a, { cls: 'w-full h-full', style: 'width:100%; height:100%;' })}
            </div>
            <h4 class="mt-5 calligraphy-title hover-line inline-block" style="font-size: 1.3rem; color: var(--silk-cream);">${a.name_zh}</h4>
            <p class="mt-2 poem-line" style="font-size: 12px; opacity: 0.7;">${(m.poem || a.dynasty).slice(0, 22)}${m.poem && m.poem.length > 22 ? '…' : ''}</p>
          </a>
        `;
      }).join('');

      MCUI.observeFadeUp();

      // ----- Audio play button cosmetics -----
      document.getElementById('playBtn').addEventListener('click', () => {
        const btn = document.getElementById('playBtn');
        btn.innerHTML = '<div style="display: flex; gap: 3px;"><div style="width: 3px; height: 16px; background: var(--gold-treasure); animation: wave 0.8s ease infinite;"></div><div style="width: 3px; height: 16px; background: var(--gold-treasure); animation: wave 0.8s ease 0.2s infinite;"></div><div style="width: 3px; height: 16px; background: var(--gold-treasure); animation: wave 0.8s ease 0.4s infinite;"></div></div>';
        btn.style.borderColor = 'var(--gold-treasure)';
      });
    })();
  </script>
  <style>
    @keyframes wave {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }
  </style>
</body>
</html>
